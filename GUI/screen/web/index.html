    if (kbdLockedNow()) return;                    // ★ 键盘锁定期内鼠标不许抢（用户 2026-10-17）
    const t = e.target;
    const card = (t && typeof t.closest === "function") ? t.closest(".tcard") : null;
    if (!card || !card.classList) return;
    const kind = TIME_BOXES.concat(AGENT_BOXES).find(k => card.classList.contains(k));
    if (kind && kind !== focusBox) { focusBox = kind; focusSource = "mouse"; renderTime(); renderAgent(); }
  });
  host.addEventListener("mouseleave", () => {
    if (kbdLockedNow()) return;                    // ★ 同上：别把键盘选中的清掉
    if (focusBox) { focusBox = null; renderTime(); renderAgent(); }
  });
}
// ★ 鼠标也能选中 SERVICE 的卡（用户 2026-10-17："选中哪个哪个展开" ——
//   鼠标总得能选；否则补充行只能靠键盘，切过去一片全展开时更看不出 ↑/↓ 有没有生效）。
function bindServiceHover() {
  const host = document.getElementById("service-cards");
  if (!host || typeof host.addEventListener !== "function") return;
  host.addEventListener("mouseover", (e) => {
    if (kbdLockedNow()) return;                    // 键盘锁定期内鼠标不许抢
    const t = e.target;
    const box = (t && typeof t.closest === "function") ? t.closest(".svc") : null;
    const id = box && box.id;
    if (id && SERVICE_BOXES.indexOf(id) >= 0 && focusBox !== id) {
      focusBox = id;
      focusSource = "mouse";
      refreshPanels();
    }
  });
  host.addEventListener("mouseleave", () => {
    if (kbdLockedNow()) return;
    if (SERVICE_BOXES.indexOf(focusBox) >= 0) {
      focusBox = null;
      focusSource = "mouse";
      refreshPanels();
    }
  });
}
function bindTimeBoxes() {
  bindBoxHover("time-cards");
  bindBoxHover("agent-cards");
  bindServiceHover();
}

function renderTime() {
  const note = document.getElementById("time-note");
  if (!timeData) {
    setBox("next", "none", '<div class="tsub">读取中…</div>', false);
    hideBox("due"); hideBox("alert");
    return;
  }
  if (!timeData.ok) {
    note.textContent = "内核不可用";
    setBox("next", "bad",
      '<div class="tlabel">TIME AGENT</div>' +
      `<div class="tbig">读不到</div><div class="tsub">${timeData.error || "未知错误"}</div>`, false);
    hideBox("due"); hideBox("alert");
    return;
  }

  const s = timeData.sessions || {};
  const now = s.now || {};
  // 面板标题右边直接用内核给的"日期 周几 · 时段 时刻"
  note.textContent = `${now.date || ""} ${now.weekday || ""} · ${now.phase || ""} ${now.time || ""}`;

  // 1) NEXT —— 课表。★ 用户 2026-10-17 改了口径：**不再"面板一展开就全给"** ✗，
  //    而是**选中哪块、哪块才展开**，其他块保持收起、把位置让给它。
  //    ⇒ 内容多少只看**该块是否被选中**（focusBox），与"面板是否展开"无关。
  const allClasses = s.sessions || [];
  const focusNext = (focusBox === "next");
  const classes = focusNext ? allClasses : allClasses.slice(0, setting("nextCount"));
  const classItem = (c) => `
      <div class="tnext">
        <div class="tleft">
          <span class="tcourse">${c.course || ""}${c.water ? "（课·水）" : ""}</span>
          <span class="tmeta">${[
            // ★★ 用户 2026-10-16：**必须写清是哪天的课**。
            //   只传了下周一的课表时，收起态那两行原本只有"08:00-09:40 · 节 1-2"，
            //   看着就像"今天的课" ✗。现在：今天写「今天」，别的写内核给的 10-19
            //   （日期字串直接用内核的 `date`，**不自己算星期几** —— 项目铁律）。
            (c.date === (now.date || "")) ? "今天" : (c.date || "").slice(5),
            c.time,
            c.periods ? "节 " + c.periods : ""
          ].filter(Boolean).join(" · ")}</span>
        </div>
        <div class="tright">
          ${c.location ? `<span class="tloc">${c.location}</span>` : ""}
        </div>
      </div>`;
  if (classes.length) {
    let items;
    if (focusNext) {
      // 按天分组：同一天的课排在一起，天与天之间加个小标题（"10-15"；今天标出来）。
      // ★ 日期字串直接用内核给的 `date`，**不自己算星期几**（项目铁律）。
      let cur = "";
      items = classes.map(c => {
        const head = (c.date !== cur)
          ? `<div class="tday">${(c.date || "").slice(5)}${c.date === (now.date || "") ? " · 今天" : ""}</div>`
          : "";
        cur = c.date;
        return head + classItem(c);
      }).join("");
    } else {
      items = classes.map(classItem).join("");
    }
    const more = (!focusNext && allClasses.length > classes.length)
      ? `（共 ${allClasses.length}）` : "";
    setBox("next", "ok",
      `<div class="tlabel">NEXT · ${classes.length} 节${more}</div>${items}`, false);
  } else {
    setBox("next", "none",
      '<div class="tlabel">NEXT</div><div class="tbig">没有课了</div>', false);
  }

  // 2) DUE —— 待办。**纯注册表信息**（用户 2026-10-14：这块没有 AGENT）。
  //    ① **过期的直接不显示** ② 按剩余时间上色（0–2h 红、2–24h 黄、其余绿）
  //    ③ 默认最多 5 条；**被选中时给全部**（框内滚动看）
  const allDue = s.due || [];
  // ★★ DDL **严格按日期升序**（用户 2026-10-23："顺序乱了，DDL 应该严格按照时间顺序排，
  //    和显示多少条无关"）—— 内核给的是按 urgency 分档的顺序 ✗（12-28 会排在 10-27 前面 ✗）。
  //    规则：有日期的按 `date`（YYYY-MM-DD）升序；**没有 DDL 日期的排最后** ✓；
  //    同一天保持内核原顺序（稳定排序 ✓，不重排同日的先后）。
  //    ★ 排序在**截断之前**做 ⇒ "显示几条"只影响尾部，不影响顺序 ✓。
  const dueSorted = allDue
    .map((d, i) => ({ d, i }))
    .sort((a, b) => {
      const da = String(a.d.date || "").trim();
      const db = String(b.d.date || "").trim();
      if (da && db) return da < db ? -1 : (da > db ? 1 : a.i - b.i);
      if (da) return -1;                       // 有日期的在前
      if (db) return 1;
      return a.i - b.i;                        // 都没日期 ⇒ 保持原顺序
    })
    .map(x => x.d);
  const alive = dueSorted.filter(d => !isExpiredDdl(d));
  const focusDue = (focusBox === "due");
  // ★ 平时只给 dueMax 条（用户 2026-10-15 定 5 条）；**选中它才给全部**
  //   （用户 2026-10-17：不再是"面板一展开就全部"）。
  const due = focusDue ? alive : alive.slice(0, setting("dueMax"));
  if (due.length) {
    // ★ 每一条都是**两行**（用户 2026-10-15）：主行 = 任务名 + 还剩多久；下一行 = 具体任务描述。
    //   描述优先用内核的 `gist`（可执行要点），没有就退到 `due_time`（截止口径）——
    //   保证"一个个都是"有描述，而不是只平铺一堆名字。
    const rows = due.map(d => {
      const mins = remainMinutes(d.why);
      const desc = d.gist || d.due_time || "";
      return `
      <div class="trow ${ddlCls(mins)}">
        <span class="tname">${d.task || ""}</span>
        <span class="twhy">${ddlWhen(d)}</span>
      </div>
      ${desc ? `<div class="tgist">${desc}</div>` : ""}`;
    }).join("");
    const more = (!focusDue && alive.length > setting("dueMax"))
      ? `（共 ${alive.length}）` : "";
    // ★★ 用户 2026-10-16：DUE 的**左边状态条**要跟着行里最严重的那条走 ——
    //   只要有一条报黄，条就黄；有红就红；有"红+闪"就**整块闪**（和行同一个关键帧）。
    const dueWorst = due.reduce((acc, d) => {
      const c = ddlCls(remainMinutes(d.why));
      const rank = { green: 0, yellow: 1, red: 2, "red-blink": 3 };
      return (rank[c] || 0) > (rank[acc] || 0) ? c : acc;
    }, "green");
    // ★ 2026-11-06：不再 `bad blink` —— 整张卡（含面板顶端那条边框）闪是用户的"展开之外
    //   还有闪烁"。红+闪只留给**行**（.trow.red-blink），卡片只标红不闪。
    const dueCls = (dueWorst === "red-blink" || dueWorst === "red") ? "bad"
                 : dueWorst === "yellow" ? "warn" : "ok";
    setBox("due", dueCls,
      `<div class="tlabel">DUE · ${due.length} 件${more}</div>${rows}`, true);
  } else {
    setBox("due", "ok", '<div class="tlabel">DUE</div><div class="tsub">没有待办</div>', true);
  }

  // 3) ALERT —— 内核的确定性异常清单。
  //    ★ 用户 2026-10-14：展开时这块**只占两行**的高度，其余**滚动看**（不做截断，
  //      所以 "list.slice" 去掉了 —— 全部渲染，靠 CSS 的 max-height + overflow 滚动）。
  //    ★★ 用户 2026-10-16：异常为 0 时**不许整块消失** ✗ ——
  //      原来走 hideBox()，那块一没，撑满的 DUE 就把空出来的面积全吃掉（"DUE 面积变得很大"）。
  //      现在永远渲染：没有就写"没有"，只占一行，和 AGENT 那块的处理保持一致。
  const an = timeData.anomalies || {};
  const list = an.anomalies || [];
  // ★ 灯（用户 2026-10-18）：正常 = **绿** ✓（以前"没问题"写成 none ＝ 不亮 ✗）；
  //   high 级异常 = 红（影响生活 / 系统无法运行）；其余异常 = 黄。
  const sev = list.some(a => a.severity === "high") ? "bad"
    : (list.length ? "warn" : "ok");
  const rows = list.map(a =>
    `<div class="tsub">· ${a.task || ""} —— ${a.detail || a.type || ""}</div>`).join("");
  setBox("alert", sev,
    `<div class="tlabel">异常 ${list.length} 条</div>` +
    (rows || '<div class="tsub">没有</div>'), false);
}

// ── AGENT 面板：时间管理 Agent 的**规划**（用户 2026-10-15）─────────────────
// 数据源（2026-10-17 起）：**主路 = 状态墙 SSE 的 `agent-plan` 帧**（数据一变就推，
// 数秒上屏）；**兜底 = 只读桥的 `/api/agent`**（桥去调内核的 context / brief / review，
// 全是只读命令），只有"没有该节点 / 帧过期 / SSE 断开"才用它（见上面 `syncPush()`）。
// 按用户的定义显示三件事：**规划**（建议执行列表）→ **详细任务**（gist）→ **为什么这样排**。
// ★ 每块的理由优先用内核的 slots[].why；内核读回时暂时会丢它（已请 AGENT 侧补一行），
//   丢的时候**降级**用任务自己的紧迫度理由（task_why，如"还剩 15 小时"）——有理由，
//   但不是"为什么排这个时段"，所以两者在界面上不混为一谈。
const AGENT_URL = "http://127.0.0.1:8091/api/agent";
let agentData = null;

// ── 规划裁决的分级（用户 2026-10-16 定的语义）─────────────────────────────
//   内核的 `plan.ok === false` 表示"完全无法合法排布"，`plan.problems[]` 逐条说卡在哪。
//   ★ 两块**不同步**，各管一段时间域：
//     · **现在**排不下（问题日期 ≤ 内核给的今天）⇒ **规划块闪红**（它管"现在做什么+核心状态"）
//     · **几天后**排不下 ⇒ **时段块报黄**，并在具体那几块上点名（它管明细）
//   ★ 日期一律用**内核给的字符串**比较（`now.date` / `problem.date` 都是 YYYY-MM-DD），
//     不做任何日期运算 —— 项目铁律"不自己算日期"。
function planProblems() { return (agentData && agentData.plan && agentData.plan.problems) || []; }
function planIsBad() { return !!(agentData && agentData.plan && agentData.plan.ok === false); }
function planToday() { return ((agentData && agentData.now) || {}).date || ""; }
function planNowBad() {
  const ps = planProblems(), t = planToday();
  return planIsBad() && (ps.length === 0 || ps.some(p => !p.date || (t && p.date <= t)));
}
function planLaterBad() {
  const ps = planProblems(), t = planToday();
  return planIsBad() && ps.some(p => p.date && t && p.date > t);
}
function planProblemTasks() {
  return new Set(planProblems().map(p => p.task).filter(Boolean));
}

function renderAgent() {
  const host = document.getElementById("agent-cards");
  const note = document.getElementById("agent-note");
  if (!host) return;
  if (!agentData) {
    setBox("aplan", "none agent-plan", '<div class="tsub">读取中…</div>', true);
    hideBox("aslots"); hideBox("arules"); hideBox("awarn");
    return;
  }
  if (!agentData.ok) {
    note.textContent = "内核不可用";
    setBox("aplan", "bad agent-plan", '<div class="tlabel">AGENT</div>' +
      `<div class="tbig">读不到</div><div class="tsub">${agentData.error || "未知错误"}</div>`, true);
    hideBox("aslots"); hideBox("arules"); hideBox("awarn");
    return;
  }
  const p = agentData.plan || {};
  const slots = p.slots || [];
  note.textContent = `规划于 ${p.created_at || "—"}` +
    (p.age_days ? `（${p.age_days} 天前）` : "");

  // 1) 规划主旨 + 覆盖范围 + 为什么触发这一轮
  // ★ 用户 2026-10-15：**严重的 DDL 与规划冲突要标红**（整份规划提醒）。
  //   判据来自内核：`ok=false` + `problems`（排到还没到的硬截止之后 / 今天有 DDL 却没排上）。
  const planBad = (p.ok === false);
  const probs = p.problems || [];
  const probTxt = probs.map(x => (x.task || "") + "（" +
    (x.kind === "past_deadline" ? "排到截止之后" : x.kind === "unscheduled" ? "今天到期却没排上"
      : x.kind) + "）").join("、");
  // ★ 2026-11-06：规划卡不再整卡闪（用户："特别是标签页的顶端"）——
    //   红+闪只留给卡里**具体那一行**（.trow.red-blink / .u-red-blink 由全局时钟驱动）。
    setBox("aplan", (planNowBad() || planIsBad() ? "bad" : (p.stale ? "warn" : "ok")) + " agent-plan", `
    <div class="tlabel">规划 · 建议执行列表</div>
    <div class="tplan">${p.focus || "（还没有规划）"}</div>
    <div class="tsub">覆盖 ${p.horizon || "—"}${p.triggered_by ? " · " + p.triggered_by : ""}</div>
    ${(p.reminders || []).length ? `<div class="tsub">⏰ ` +
        (p.reminders || []).filter((r, i) => i < 2).map(r => ((r.at || "").slice(5) || (r.date || "").slice(5)) +
          " " + (r.text || "")).join("　·　") + `</div>` : ""}
    ${planBad ? `<div class="tsub u-red-blink">★ 与硬截止冲突 ${probs.length} 处：${probTxt}` +
      `　—— 要重排，或如实报告排不下</div>` : ""}`, false);

  // 2) 时段（主体）：按天分组。三行分别是
  //    · 时间 + 任务（**紧迫度上色**：正常白 / 紧急橙 / 紧急且 12 小时内红）
  //    · 详细任务（**白色** —— 用户说这条信息重要）
  //    · 理由（**灰色**，前面一个右箭头，不再写"为什么排这儿"四个字）
  let cur = "";
  const rows = slots.map(s => {
    const head = (s.date !== cur) ? `<div class="tday">${(s.date || "").slice(5)}</div>` : "";
    cur = s.date;
    const mins = remainMinutes(s.left);
    const urgent = (s.urgency === "urgent");
    const red12 = urgent && mins !== null && mins <= 720;      // 紧急 且 12 小时内
    // ★ 用户 2026-10-15：严重的 DDL/规划冲突要标红；任务 DDL 进**红色闪烁区**时这块跟着闪。
    //   闪烁/红色阈值**复用 DUE 那块的 `ddlCls`**（<6h 红闪、<12h 红）—— 不另立一套，
    //   否则"跟着闪"就会闪在不同的时候。
    const flags = s.flags || [];
    const late = flags.indexOf("past_deadline") >= 0;          // 排在自己的硬截止之后
    const crossing = flags.indexOf("crosses_deadline") >= 0;   // 跨过截止（前半段赶得上）
    const dueCls = ddlCls(mins);
    const ucls = (late || dueCls === "red-blink") ? "u-red-blink"
      : (crossing || red12 || dueCls === "red") ? "u-red"
      : (urgent ? "u-urgent" : "u-normal");
    const tag = late ? "★ 排到截止之后" : crossing ? "跨过截止"
      : dueCls === "red-blink" ? "DDL 6 小时内" : red12 ? "紧急 · 12 小时内" : (urgent ? "紧急" : "");
    const why = s.why || "";
    const fallback = (!why && s.left) ? s.left : "";
    return head + `
      <div class="tnext">
        <div class="tleft">
          <span class="tcourse ${ucls}">${s.time || ""}　${s.task || ""}${tag ? `　[${tag}]` : ""}</span>
          ${s.gist ? `<span class="agent-gist">${s.gist}</span>` : ""}
          ${(why || fallback) ? `<span class="agent-why">← ${why || fallback}</span>` : ""}
          ${planProblemTasks().has(s.task) ? '<span class="agent-why u-red-blink">⚠ 排不下</span>' : ""}
        </div>
      </div>`;
  }).join("");
  if (slots.length) {
    // ★ 时段块只管**明细**：只有"几天后排不下"才在这里报警（黄），并点名到具体那几块
    //   （行里会带 `⚠ 排不下`）。"现在排不下"归**规划块**闪红，这里不抢它的戏。
    const laterBad = planLaterBad();
    setBox("aslots", (laterBad ? "warn" : "ok") + " agent-slots",
      `<div class="tlabel">时段 · ${slots.length} 块${laterBad ? " · 有排不下的" : ""}</div>${rows}`, true);
  } else {
    setBox("aslots", "none agent-slots", '<div class="tlabel">时段</div><div class="tsub">没有规划</div>', true);
  }

  // 3) 规划依据 —— 规则本体（用户口述的偏好/约束，带来源）
  const rules = agentData.rules || [];
  if (rules.length) {
    const rr = rules.map(r => `<div class="tsub">· ${r.body || ""}` +
      `<span class="trule">（${r.kind === "constraint" ? "硬约束" : "偏好"}${r.source ? " · " + r.source : ""}）</span></div>`).join("");
    setBox("arules", "ok agent-rules", `<div class="tlabel">规划依据 · ${rules.length} 条</div>${rr}`, false);
  } else {
    hideBox("arules");
  }

  // 4) 软偏好被碰 / 有 DDL 却排不上
  //    ★ 这一块**永远渲染**（哪怕没有内容也显示"没有"）—— 用户 2026-10-15：
  //      "碰了软偏好直接消失了"。消失的原因是 `brief` 取不到 warnings 时我把它整块 hide 了，
  //      于是它时有时无。宁可显示"没有"，也不要让它凭空消失。
  const warns = agentData.warnings || [];
  const uns = agentData.unscheduled || [];
  const wr = warns.map(w => `<div class="tsub">· ${w.date || ""} ${w.slot || ""} ` +
    `${w.task || ""} —— ${w.kind || ""}${w.rule ? "（" + w.rule + "）" : ""}</div>`).join("");
  const ur = uns.map(u => `<div class="tsub">· 排不上：${u.task || ""} —— ${u.why || ""}</div>`).join("");
  const emptyWarn = (!warns.length && !uns.length) ? '<div class="tsub">没有</div>' : "";
  // ★ 灯：**排不上**（有 DDL 却没位置）= 红（影响生活）；只碰了软偏好 = 黄；都没有 = 绿 ✓
  const awarnLv = uns.length ? "bad" : (warns.length ? "warn" : "ok");
  setBox("awarn", awarnLv + " agent-warn",
    `<div class="tlabel">碰了软偏好 ${warns.length} 处` +
    `${uns.length ? ` · 排不上 ${uns.length} 件` : ""}</div>${wr}${ur}${emptyWarn}`, false);
}

// ★ 按需重排（用户 2026-10-15 定的**触发策略**）：计划表**最上面那条**完成后才提示重排。
//   判据由桥给（`top_done`：最上面那个时段的任务已不在活跃注册表里 ⇒ 已完成/已取消，
//   而计划表还挂着它）。桥只报告事实，"重排"这件事仍然由 Agent 做 —— 点了按钮就把话
//   交给 Agent（和对话同一条通路），所以这里**不会**偷偷产生模型调用。
function updateReplanHint() {
  const btn = document.getElementById("dock-replan");
  if (!btn) return;
  if (replanBusy) return;                 // 正在排/刚排完：别被数据刷新盖掉按钮上的字
  const topDone = !!(agentData && agentData.ok && agentData.top_done);
  btn.hidden = false;                     // ★ 常驻：一键重排不藏在条件后面（用户 2026-11-08）
  btn.className = topDone ? "topdone" : "";
  btn.textContent = topDone
    ? "⚠ 重排（最上面那条已完成：" + (agentData.top_task || "") + "）"
    : "⟳ 重排";
}

// ── 一键重排（用户 2026-11-08「可以一键发起重排，然后把它写上 GUI」）────────
//   ★ 它**不**打开对话、也**不**自己拼提示词：桥的 /api/replan 启动 `qyn-agent-replan.service`
//   （同一套 tick 管道 = 重排 + 存快照 + 推大屏）。页面只做三件事：点、等、刷新。
function replanPaint(mode, text) {
  const btn = document.getElementById("dock-replan");
  if (!btn) return;
  btn.hidden = false;
  btn.className = mode === "busy" ? "busy" : (mode === "done" ? "done" : "");
  if (text) btn.textContent = text;
  else updateReplanHint();
}

// 排完之后强制取一次新数据（桥有 15 秒缓存，不带 force 会看到旧规划）
async function refreshAfterReplan() {
  try {
    const r = await fetch(AGENT_URL + "?force=1", { cache: "no-store" });
    agentFallback = await r.json();
  } catch (e) { /* 保留旧数据，推送还会再来一帧 */ }
  syncPush(); renderAgent(); updateReplanHint(); renderTime();
  try {
    const r2 = await fetch(TIME_URL + "?force=1", { cache: "no-store" });
    timeFallback = await r2.json();
  } catch (e) { /* 同上 */ }
  syncPush(); renderTime();
}

async function replanNow() {
  if (replanBusy) return;                 // 连点只跑一轮（桥那边也是幂等：单元在跑就不再起）
  replanBusy = true;
  replanPaint("busy", "⟳ 重排中…");
  const startedAt = Date.now();
  try {
    const r = await fetch(REPLAN_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=UTF-8" },
      body: "",
    });
    const d = await r.json();
    if (r.status === 429 || d.busy) {
      replanBusy = false;
      replanPaint("busy", "⚠ 有一轮在跑，稍后再点");
      setTimeout(() => { if (!replanBusy) updateReplanHint(); }, 4000);
      return;
    }
    if (!d.ok) {
      replanBusy = false;
      replanPaint("busy", "✗ 没起来：" + (d.error || "未知"));
      setTimeout(() => { if (!replanBusy) updateReplanHint(); }, 6000);
      return;
    }
  } catch (e) {
    replanBusy = false;
    replanPaint("busy", "✗ 桥不可用");
    setTimeout(() => { if (!replanBusy) updateReplanHint(); }, 6000);
    return;
  }
  // 轮询到"不在跑"为止。★ 刚点完的几秒内别把空闲当成"排完了"（启停之间有空档）
  const poll = async () => {
    try {
      const d = await (await fetch(REPLAN_URL, { cache: "no-store" })).json();
      const running = !!(d.ok && d.state === "running");
      const grace = Date.now() - startedAt < 6000;
      if (!running && !grace) {
        replanBusy = false;
        const bad = !!(d.ok && d.exit_status && d.exit_status !== 0);
        replanPaint(bad ? "busy" : "done", bad ? "✗ 重排失败（看日志）" : "✓ 已重排");
        refreshAfterReplan();
        setTimeout(() => { if (!replanBusy) updateReplanHint(); }, 7000);
        return;
      }
      if (Date.now() - startedAt > REPLAN_MAX_MS) {
        replanBusy = false;
        replanPaint("busy", "⏱ 还在跑（已等 6 分钟）");
        setTimeout(() => { if (!replanBusy) updateReplanHint(); }, 7000);
        return;
      }
      setTimeout(poll, REPLAN_POLL_MS);
    } catch (e) {
      replanBusy = false;
      updateReplanHint();
    }
  };
  setTimeout(poll, 1500);
}

// ★ 现在它是**兜底**取数（原先每 20 秒、是主路）：结果先落 `agentFallback`，
//   再由 `syncPush()` 决定用推送还是用它 —— 推送在线时它绝不覆盖推送渲染。
async function loadAgent() {
  try {
    const r = await fetch(AGENT_URL, { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    agentFallback = await r.json();
  } catch (e) {
    agentFallback = { ok: false, error: "桥不可用：" + e };
  }
  syncPush();
  renderAgent();
  updateReplanHint();
}

// ── 对话（用户 2026-10-15）：底部预留条点开 → 从下面弹起、覆盖全屏 ────────────
// **纯文字版**：输入 → POST 给只读桥的 /api/chat（桥把话交给时间管理 Agent 跑一轮）→ 显示回复。
// ★ 请求体用 text/plain 而不是 JSON：页面在 :8090、桥在 :8091，是跨源；JSON 会触发
//   CORS 预检（OPTIONS），text/plain 属于"简单请求"不需要预检。
const CHAT_URL = "http://127.0.0.1:8091/api/chat";
// ★ 一键重排（用户 2026-11-08）：桥的 /api/replan 启动一轮重排（systemd 按需单元），
//   规划本身还是 tick.sh 做的 —— 页面只负责"点一下 → 等它排完 → 刷新"。
//   POST 用 text/plain + 空体：跨源但不触发 CORS 预检（和对话同一条规矩）。
const REPLAN_URL = "http://127.0.0.1:8091/api/replan";
const REPLAN_POLL_MS = 2500;        // 轮询间隔
const REPLAN_MAX_MS = 6 * 60 * 1000; // 最多等 6 分钟（一轮 TimeoutStartSec 是 15 分钟）
let replanBusy = false;
let chatBusy = false;

function chatAppend(kind, text) {
  const log = document.getElementById("chat-log");
  if (!log) return;
  const div = document.createElement("div");
  div.className = "msg " + kind;
  div.textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}
function chatOpen() {
  const el = document.getElementById("chat");
  if (!el) return;
  el.className = "chat-open";
  const log = document.getElementById("chat-log");
  if (log && !log.childNodes.length) {
    chatAppend("sys", "跟时间管理 Agent 说话（纯文字版）：它能登记、改期、重排、回答问题。");
  }
  const t = document.getElementById("chat-text");
  if (t && typeof t.focus === "function") t.focus();
}
function chatClose() {
  const el = document.getElementById("chat");
  if (el) el.className = "chat-closed";
  // ★ 关掉后必须**把焦点从隐藏的输入框上摘下来**（用户 2026-10-20）：
  //   否则焦点留在看不见的 input 里 ⇒ 打字没反应、方向键也进不到面板 ✓
  const t = document.getElementById("chat-text");
  if (t && typeof t.blur === "function") t.blur();
}
// ── 对话带图（用户 2026-10-20："可以尝试把纯文字版的接入图片能力"）──────────
// 屏幕只负责**收集 + 传给桥**：桥把图落盘、再把 DSH 的 `@路径` 拼进提示词，
// Agent 拿到就能用 read_image 打开（课表截图 / 作业照片都行）。
// 传法沿用"简单请求"：body 仍是 text/plain，只是内容是 JSON ⇒ 不触发 CORS 预检。
let chatImages = [];                    // [{name, b64}]
const CHAT_MAX_IMAGES = 3;

function chatRenderChips() {
  const box = document.getElementById("chat-chips");
  if (!box) return;
  box.hidden = chatImages.length === 0;
  box.innerHTML = chatImages.map((im, i) =>
    '<span class="chat-chip">🖼 ' + im.name +
    ' <button type="button" data-i="' + i + '" title="移除">×</button></span>').join("");
  // 事件委托：小片每次重画，直接绑在按钮上会随重画失效
  if (typeof box.onclick !== "function") {
    box.onclick = (e) => {
      const t = e.target;
      const b = (t && typeof t.closest === "function") ? t.closest("button[data-i]") : null;
      if (!b) return;
      chatImages.splice(Number(b.dataset.i), 1);
      chatRenderChips();
    };
  }
}
function chatAddImage(file) {
  if (!file || chatImages.length >= CHAT_MAX_IMAGES) return;
  const r = new FileReader();
  r.onload = () => {
    const s = String(r.result || "");
    const comma = s.indexOf(",");
    if (comma < 0) return;
    chatImages.push({ name: file.name || "image.png", b64: s.slice(comma + 1) });
    chatRenderChips();
  };
  r.readAsDataURL(file);
}

async function chatSend(text) {
  if (chatBusy) { chatAppend("sys", "Agent 还在处理上一条，稍等…"); return; }
  chatBusy = true;
  const state = document.getElementById("chat-state");
  if (state) state.textContent = "Agent 思考中…";
  chatAppend("user", text);
  // ★ client_msg_id（用户 2026-10-20）：同一条消息重复到达（重复点击/网络重发）只跑一次 Agent ✓
  //   纯文字也改发 JSON 字符串（body 仍是 text/plain ⇒ 不触发 CORS 预检 ✓），这样才能带上 id ✓
  const mid = "w" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8);
  try {
    const body = JSON.stringify({ text: text, images: chatImages, client_msg_id: mid });
    const r = await fetch(CHAT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=UTF-8" },  // 简单请求，避开 CORS 预检
      body: body,
    });
    chatImages = [];                                        // 发出去了就清空待发小片
    chatRenderChips();
    const d = await r.json();
    if (r.status === 429 || d.busy) {
      // ★ 忙（墙/手机/定时共用一把锁）⇒ 明确告诉人，**不自动重试** ✓；
      //   把话放回输入框，方便再发一次 ✓
      chatAppend("sys", "现在有一轮还在跑：" + (d.error || "忙") + "。稍后再发一次（没有自动重试）。");
      const t = document.getElementById("chat-text");
      if (t) t.value = text;
    } else {
      chatAppend(d.ok ? "agent" : "sys",
        d.ok ? (d.reply || "（空回复）") : ("出错了：" + (d.error || "未知")));
    }
  } catch (e) {
    chatAppend("sys", "桥不可用：" + e);
  }
  chatBusy = false;
  if (state) state.textContent = "文字 + 图片";
  loadAgent();          // Agent 可能改了数据 —— 顺手把规划与时间刷新一次
  loadTime();
}
function bindChat() {
  const dock = document.getElementById("dock");
  const close = document.getElementById("chat-close");
  const form = document.getElementById("chat-form");
  const text = document.getElementById("chat-text");
  if (dock && typeof dock.addEventListener === "function") {
    dock.addEventListener("click", chatOpen);
  }
  if (close && typeof close.addEventListener === "function") {
    close.addEventListener("click", chatClose);
  }
  // ★ 带图的两条入口（用户 2026-10-20）：直接 Ctrl+V 贴图（最顺手）、或 📎 选文件
  const pick = document.getElementById("chat-pick");
  const file = document.getElementById("chat-file");
  if (pick && file && typeof pick.addEventListener === "function") {
    pick.addEventListener("click", () => file.click());
    file.addEventListener("change", () => {
      Array.from(file.files || []).forEach(chatAddImage);
      file.value = "";                       // 清空，允许连续选同一张
    });
  }
  if (text && typeof text.addEventListener === "function") {
    text.addEventListener("paste", (e) => {
      const items = (e.clipboardData && e.clipboardData.items) || [];
      let got = false;
      for (const it of items) {
        if (it && it.kind === "file" && String(it.type || "").indexOf("image/") === 0) {
          chatAddImage(it.getAsFile());
          got = true;
        }
      }
      if (got) e.preventDefault();           // 贴图时不把占位文本塞进输入框
    });
  }
  // 按需重排按钮：先开对话（让你看见这次交互），再把"已完成，请重排"交给 Agent
  // ★ 一键重排（用户 2026-11-08）：点一下直接调接口，**不再**打开对话、
  //   也不再自己拼一句话让 Agent 去理解 —— 请求里没有参数，"重排"由 Agent 那一轮自己判断。
  const replan = document.getElementById("dock-replan");
  if (replan && typeof replan.addEventListener === "function") {
    replan.addEventListener("click", (e) => {
      e.stopPropagation();                       // 别同时触发 dock 的"打开对话"
      replanNow();
    });
  }
  if (form && typeof form.addEventListener === "function") {
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const v = ((text && text.value) || "").trim();
      if (!v) return;
      if (text) text.value = "";
      chatSend(v);
    });
  }
  // ★ Esc / Enter 统一由 `bindKeys()` 处理（用户 2026-10-20：Esc 不许有两个监听器）✓
}

// ★ 同 loadAgent：它现在是**兜底**取数（60 秒一次）。推送在线时，这里拿到的异常清单
//   会被 `timeFromFrame()` 沿用（契约的推送帧里没有 anomalies），其余字段以推送为准。
async function loadTime() {
  try {
    const r = await fetch(TIME_URL, { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    timeFallback = await r.json();
  } catch (e) {
    timeFallback = { ok: false, error: "桥不可用：" + e };
  }
  syncPush();
  renderTime();
}

// ── 标签页：收起 / 依次展开（用户 2026-10-14；2026-10-15 改成**按权重分配**）──────
// 同一时刻只有**一个**面板展开，其余收起。五块 = **三小两大**：
//   SERVICE / DATACENTER / NETWORK = 小（权重 1）；TIME / AGENT = 大（权重 2）。
// ★ 为什么不再用"固定 px"（原来那套 flex: 0 0 373px）：五块按固定宽度排，某块一展开就会
//   溢出屏幕 —— 数学上无解（"展开 = 收起×2"下，5 块铺满后展开必多占半块 ⇒ w ≤ 0）。
// ★ 现在改成 **flex-grow 权重 + flex-basis: 0**：整行**永远刚好铺满**，展开那块权重翻倍。
//   全收起（权重 1+1+1+2+2 = 7）⇒ 小 ≈ U/7、大 ≈ 2U/7；
//   **小模块展开**（权重 2，总 8）⇒ 它拿 U/4 —— 正好等于原来"小模块展开"的大小 ✓。
const TABS = [
  { id: "panel-service", cls: "panel",      weight: 1 },   // 空模块（未来放内容）
  { id: "panel-dc",      cls: "panel",      weight: 1 },
  { id: "panel-net",     cls: "panel",      weight: 1 },
  { id: "panel-time",    cls: "panel wide", weight: 2 },
  { id: "panel-agent",   cls: "panel wide", weight: 2 },
];
const TIME_TAB_INDEX = 3;    // ↑/↓ 移动子框光标时要把 TIME 展开成这一块
const AGENT_TAB_INDEX = 4;
// 轮换间隔**按面板分两档**（用户 2026-10-15）：小的三块 5 秒、大的两块 15 秒
function rotateMsFor(i) { return ((i <= 2) ? setting("fastSec") : setting("slowSec")) * 1000; }
let tabIndex = 0;            // 自动轮转选中的那个
let hoverIndex = null;       // 鼠标悬停的那个（优先级更高）
let lastRotateAt = Date.now();
// ★★ 键盘/鼠标**互斥锁**（用户 2026-10-17："键盘鼠标操作冲突，建议加个阻塞"）：
//   问题有两处 ——
//   ① 键盘刚操作完，鼠标一点点晃动/重新进面板就把选中抢回去；
//   ② 键盘选好了子框、鼠标恰好静止 ⇒ `idleResumeSec` 那段"闲置恢复"会**把键盘的选中清掉** ✗
//      （鼠标闲不闲，跟你用不用键盘无关）。
//   这里用 lastKeyAt 记最后一次键盘操作；锁定期内鼠标一律不生效，闲置恢复也不动画面。
//   值设 0 = 关闭锁定（完全回到老行为）。
let lastKeyAt = 0;
let focusSource = "";        // 当前子框焦点是谁给的："key" | "mouse"
function kbdLockedNow() {
  const hold = setting("kbdHoldSec") * 1000;
  return hold > 0 && (Date.now() - lastKeyAt) < hold;
}
let lastActive = -1;         // 用于"标题打字机"：展开的块换人时打一次
let typingOn = -1;
let typingTimer = null;

// 当前该放大的那个：**鼠标悬停优先**，否则用自动轮转的
function activeIndex() { return hoverIndex === null ? tabIndex : hoverIndex; }

function applyTabs() {
  const active = activeIndex();
  // 展开的块换人了 ⇒ 标题做一次"颜色打字机"（用户 2026-10-15）
  if (active !== lastActive) {
    lastActive = active;
    typingOn = active;
    clearTimeout(typingTimer);
    typingTimer = setTimeout(() => { typingOn = -1; applyTabs(); }, 1300);
  }
  // 整墙扫光的截止时间（展开时设置 ✓ 5.2s 后自动失效 ✓）
  var __sweepUntil = __sweepUntil || 0;
  TABS.forEach((t, i) => {
    const el = document.getElementById(t.id);
    if (!el) return;
    const on = (i === active);
    el.className = t.cls + (on ? "" : " collapsed") + (i === typingOn ? " typing" : "");
    // ★★ 2026-11-06（用户澄清）：**展开后整墙只扫一轮** ✓
    //    · 从"收起 → 展开"的那一刻：给 <body> 挂 .sweep，5.2 秒后自动结束 ✓
    //    · 不再给每栏各挂一个（那样几栏高光会"各扫各的" ⇒ 混乱 ✗）
    //    · 用 classList.toggle（值没变就不重启动画 ✓），避免 className 重写把类冲掉 ✗
    if (on && el.__wasCollapsed === true) { __sweepUntil = Date.now() + 5200; }
    el.__wasCollapsed = on;
    if (document.body && document.body.classList) {
      const on2 = !!(__sweepUntil && Date.now() < __sweepUntil);
      if (document.body.classList.contains("sweep") !== on2) document.body.classList.toggle("sweep", on2);
    }
    // ★ 宽度用**内联 flex 权重**：basis 0 + grow = 权重（展开那块翻倍）。
    //   整行永远刚好铺满（用户 2026-10-15 定的方案），不再依赖任何固定 px。
    el.style.flexBasis = "0";
    el.style.flexGrow = String(on ? t.weight * 2 : t.weight);
    el.style.flexShrink = "0";
  });
}
// 方向键 / 自动轮转都用它：step=+1 下一个、-1 上一个
function nextTab(step) {
  const s = (step === undefined) ? 1 : step;
  tabIndex = (tabIndex + s + TABS.length) % TABS.length;
  // ★★ 换面板必须**把子框光标清零**（用户 2026-10-15 报的严重 bug）：
  //    否则旧面板会"记住"上次被放大的那一块 —— 切走再切回来、甚至收起状态下，
  //    它还保持着被放大的样子，而不是恢复默认。
  focusBox = null;
  lastRotateAt = Date.now();   // 手动换过之后重新计时，先让用户看完这一块
  refreshPanels();
}
// ★★ 切换面板/子框的**唯一入口**：换 class 之后**必须重画**。
//   原因：两块面板显示多少内容取决于"面板是不是展开的"（NEXT 全部 vs 只 N 节、
//   DUE 全部 vs dueMax 条）。只换 class 不重画 ⇒ 用鼠标切走时内容会停在旧状态 ✗
//   （用户 2026-10-15 报的"选中展开后切走不恢复"就是这个）。
// ★ 卡片级焦点（用户 2026-10-17）：机器卡在模板里自带 `.focus`；SERVICE 的四个容器是
//   **缓存渲染**的（innerHTML 不重写）⇒ 类只能在**外面**刷，否则每换一次焦点都要重画整卡。
//   用 className 而不是 classList —— 测试替身没有 classList，这样保持可测。
function applyCardFocus() {
  SERVICE_BOXES.forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    const want = "svc" + (focusBox === id ? " focus" : "");
    if (el.className !== want) el.className = want;
  });
}

// ★ 监视栏两块卡片区（DATACENTER 机器卡 + NETWORK 网卡）—— 抽成函数，
//   好让 refreshPanels 也能刷新它们：**焦点蓝框写在模板里**，而 refreshPanels 原来
//   不重画卡片 ⇒ 换面板后旧那张卡的蓝框会留在屏幕上（用户 2026-10-17："NETWORK 有错误蓝框"）。
function renderCards() {
  const dc = document.getElementById("cards");
  if (dc) dc.innerHTML = MACHINES.map(card).join("");
  const nin = document.getElementById("net-in");
  if (nin) nin.innerHTML = MACHINES.map(netBlock).join("");
  const nout = document.getElementById("net-out");
  if (nout) nout.innerHTML = internetBlocks();
}

function refreshPanels() {
  applyTabs();
  renderTime();
  renderAgent();
  applyCardFocus();     // SERVICE 的卡容器：焦点类靠这里刷
  renderCards();        // 监视栏的机器卡：焦点类在模板里，必须重画才跟得上
}
// 悬停 / 移走 —— 独立成函数，测试可以直接调（DOM 事件在测试替身里没有）
function setHover(i) { hoverIndex = i; focusSource = "mouse"; refreshPanels(); }
function clearHover() {
  hoverIndex = null;
  lastRotateAt = Date.now();   // ★ 移走之后**重新计时**再恢复自然轮转（用户 2026-10-15）
  refreshPanels();
}

// 交互绑定：鼠标悬停放大；方向键选择当前放大的模块（用户 2026-10-15）
function bindTabs() {
  TABS.forEach((t, i) => {
    const el = document.getElementById(t.id);
    if (!el || typeof el.addEventListener !== "function") return;
    el.addEventListener("mouseenter", () => { if (!kbdLockedNow()) setHover(i); });
    el.addEventListener("mouseleave", clearHover);
  });
}

// ══ 键盘：**全页只有一个 keydown 监听器**（用户 2026-10-20 报的三个输入 bug）══════
//   ① 关对话后焦点仍留在隐藏输入框 ✗ ⇒ `chatClose()` 里 blur（见上）✓
//   ② 输入框里按左右键被全局抢走光标 ✗ ⇒ 先判"正在输入"就**原样放行**给输入框 ✓
//   ③ Esc 有两个监听器 ✗ ⇒ 合并成这一个：先关**最上层**浮层（设置 > 对话）✓
//   顺带保留原来的两条经验：一按键就清掉鼠标悬停覆盖；单个动作抛错不许让整个键盘死掉。
function isEditing(e) {
  const t = e && e.target;
  if (!t) return false;
  const tag = String(t.tagName || "").toUpperCase();
  return tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || !!t.isContentEditable;
}
function chatIsOpen() {
  const el = document.getElementById("chat");
  return !!(el && String(el.className).indexOf("chat-open") >= 0);
}
function blurEditable() {
  const a = document.activeElement;
  if (a && typeof a.blur === "function" && isEditing({ target: a })) a.blur();
}
// ══ Esc 按住 3 秒 ⇒ 熄屏（用户 2026-10-20 的规则 5）════════════════
//   ★ 复用上面**唯一那个** keydown 监听器起表，keyup 取消；3 秒内松手不算数
//     （单击 Esc 仍然只是"关浮层"，不会误熄屏）。
//   ★ 调的是屏幕策略服务（:8092，见 CENTRAL/HARDWARE/qyn-screen-policy.py）：
//     它负责"灭"，也负责之后"输入唤醒"的豁免，避免策略 20 秒后又把屏灭掉。
const SCREEN_OFF_HOLD_MS = 3000;
let escHoldTimer = null;
function screenOffNow() {
  try {
    fetch("http://127.0.0.1:8092/off", { method: "POST" }).catch(() => {});
  } catch (err) { /* 策略服务没起：静默，不影响键盘 */ }
}
function escHoldStart() {
  if (escHoldTimer) return;                       // 按住会连发 keydown，只起一次
  escHoldTimer = setTimeout(() => { escHoldTimer = null; screenOffNow(); }, SCREEN_OFF_HOLD_MS);
}
function escHoldCancel() {
  if (escHoldTimer) { clearTimeout(escHoldTimer); escHoldTimer = null; }
}

function bindKeys() {
  if (typeof document.addEventListener !== "function") return;
  document.addEventListener("keydown", (e) => {
    // ① Esc：关最上层浮层（设置优先，其次对话）—— 全页**只有这一处**处理 Esc ✓
    if (e.key === "Escape") {
      const set = document.getElementById("settings");
      if (set && set.hidden === false && typeof settingsToggle === "function") {
        settingsToggle(false); blurEditable(); e.preventDefault(); return;
      }
      if (chatIsOpen()) { chatClose(); e.preventDefault(); return; }
      // ③ 没有浮层时：按住 3 秒 = 熄屏（松手取消）；单击不受影响
      escHoldStart(); e.preventDefault(); return;
    }
    // ② 正在输入框里 ⇒ 其余按键**全部交给输入框**（左右键要能移光标 ✓）
    if (isEditing(e)) return;
  // ②-b T 键：轮换主题（可热插拔 UI ✓）
  if (e.key === "t" || e.key === "T") { cycleTheme(); e.preventDefault(); return; }
    // ③ Enter（没浮层时）⇒ 拉起对话 —— 但**焦点在按钮上就不抢**（让按钮自己响应 ✓，
    //    比如齿轮/主灯；否则合并监听后按 Enter 会变成"打开对话"✗）
    if (e.key === "Enter") {
      const tg = e.target;
      if (tg && String(tg.tagName || "").toUpperCase() === "BUTTON") return;
      if (!chatIsOpen()) { chatOpen(); e.preventDefault(); }
      return;
    }
    // ④ 面板导航（只在"没在输入"时）
    try {
      if (e.key === "ArrowRight") { clearHover(); nextTab(1); }
      else if (e.key === "ArrowLeft") { clearHover(); nextTab(-1); }
      else if (e.key === "ArrowDown") { clearHover(); moveFocus(1); }
      else if (e.key === "ArrowUp") { clearHover(); moveFocus(-1); }
      else if (e.key === "+" || e.key === "=") { clearHover(); scrollFocus(1); }
      else if (e.key === "-" || e.key === "_") { clearHover(); scrollFocus(-1); }
      else return;                      // 别的键不碰
      // ★ 记下"人在用键盘"：之后 kbdHoldSec 秒内鼠标不许抢走选中（用户 2026-10-17）
      lastKeyAt = Date.now();
      focusSource = "key";
    } catch (err) {
      // ★★ 单个动作失败**不许让整个键盘失效**（用户 2026-10-17 报"键盘展开整个崩了"）✗
      console.error("键盘动作失败", err);
      return;
    }
    e.preventDefault();
  });
  // 松手 / 窗口失焦 ⇒ 取消"按住熄屏"的计时（否则切走再回来会误灭）
  document.addEventListener("keyup", (e) => { if (e.key === "Escape") escHoldCancel(); });
  window.addEventListener("blur", () => escHoldCancel());
}

// 时钟：**日期 + 时间**（用户 2026-10-16：右上角时间前面要加日期）
// ★ 拆成两段：`.clk-d`（日期，字号更大）/.clk-t（时刻）—— 用户 2026-10-19："日期字号大一点"。
//   注意**别写 `#clock.textContent`**：那会把子 span 全抹掉 ✗（兜底分支留着防结构变）
setInterval(() => {
  const d = new Date();
  const p = (n) => String(n).padStart(2, "0");
  const dateTxt = `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
  const timeTxt = `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
  const el = document.getElementById("clock");
  if (!el) return;
  const dEl = (typeof el.querySelector === "function") ? el.querySelector(".clk-d") : null;
  const tEl = (typeof el.querySelector === "function") ? el.querySelector(".clk-t") : null;
  if (dEl && tEl) { dEl.textContent = dateTxt; tEl.textContent = timeTxt; }
  else el.textContent = dateTxt + " " + timeTxt;      // 兜底：结构变了也照常显示
}, 1000);
// ★ 整屏重画的兜底节奏：5s → **1.5s**（用户 2026-10-17："这一行要几秒才能渲染" ✗）。
//   正常路径是 SSE 收到 sample 立刻 render ✓；这个定时器只是"没有推送时"的兜底，
//   5 秒会让新行/新值最多滞后 5 秒 ⇒ 收紧到 1.5 秒。整屏重画约 30 张卡，这个频率在 kiosk 上很轻。
setInterval(render, 1500);
// ★★ 推送体系（用户 2026-10-17）：主路是 SSE 里的 `agent-plan` 帧（数据一变就推，
//   数秒上屏）；下面这两条是**兜底轮询**，间隔放宽到 60 秒 —— 只有"没有该节点 / 帧过期 /
//   SSE 断开"时才会用到它们（`syncPush()` 里选源）。
//   ⚠ 间隔是**加载时**定下的：改了页面必须重载 kiosk（systemctl --user restart qyn-kiosk）。
setInterval(loadTime, POLL_MS);
setInterval(loadAgent, POLL_MS);
// 推送守卫：帧过期 / SSE 断开都靠时间发现（不会有新事件通知），2 秒一次
setInterval(pushGuard, 2000);
// 一个 250ms 的心跳同时驱动两件事，让"标题翻页"和"面板轮换"落在同一个 5 秒节拍上
// （用户 2026-10-15：标题 5 秒切要和主面板 5 秒**同时**）
// ★★ 鼠标"停着不动"也要能自动恢复轮转（用户 2026-10-16 报的"自动轮切掉了"）：
//   原来只有 mouseleave 才清悬停 —— 鼠标停在屏幕上不动时 hoverIndex 一直非空，
//   心跳里那句 `if (hoverIndex !== null) return` 永远命中 ⇒ **轮切彻底停摆** ✗。
//   现在记最后活动时刻，闲置超过设置里的「鼠标闲置后恢复轮切」（默认 20 秒）就当"人走了"，
//   清掉悬停接着轮转。阈值走 setting()，可在设置面板里调（用户 2026-10-16）。
let lastMouseAt = Date.now();
if (typeof document.addEventListener === "function") {
  document.addEventListener("mousemove", () => { lastMouseAt = Date.now(); });
  // 鼠标离开窗口 ⇒ 立刻视为闲置（不用再等 20 秒）
  document.addEventListener("mouseleave", () => { lastMouseAt = 0; });
}
// 心跳主体抽成函数：测试可以直接调它，不必等真实定时器
function rotateTick() {
  const now = Date.now();
  const tick = Math.floor((now - T0) / 5000);
  if (tick !== titleTick) { titleTick = tick; flipTitle(); }
  // ★ 闲置够久 ⇒ 当人走了：清悬停 + 清子框放大，并重新计时，让轮转自动恢复
  // ★★ 但**键盘锁定期内完全跳过**（用户 2026-10-17："键盘鼠标操作冲突，加个阻塞"）：
  //    键盘刚操作完、鼠标恰好静止 ⇒ 这段逻辑会把键盘选中的东西清掉 ✗
  //    （鼠标闲不闲，跟你用不用键盘无关）。
  const kbdLocked = kbdLockedNow();
  // ★★ 2026-10-26（用户："自动轮切又失效了"✗）—— 心跳实测发现：
  //   kiosk 上的指针**常常就静止停在某一块上** ⇒ `hoverIndex !== null` 一直成立
  //   ⇒ 轮切被暂停，要干等 `idleResumeSec`（默认 20 秒）才恢复 ✗。
  //   修法：**只有"鼠标刚动过"才算人在看**（4 秒内）；静止的指针不许压住轮切 ✓。
  //   旧的 `idleResumeSec` 仍管"多久后彻底清掉悬停/子框"（保留原语义 ✓）。
  const MOUSE_ACTIVE_MS = 4000;
  const mouseIdle = (now - lastMouseAt) > Math.min(setting("idleResumeSec") * 1000, MOUSE_ACTIVE_MS);
  if (!kbdLocked && (hoverIndex !== null || focusBox !== null) && mouseIdle) {
    hoverIndex = null;
    // ★ 只有**鼠标**给的子框焦点才跟着清；键盘选中的保留（那是人在用键盘 ✓）
    if (focusSource !== "key") focusBox = null;
    lastRotateAt = now;
    refreshPanels();
  }
  if (kbdLocked) return;                                  // 锁定期内也不自动轮转，别抢画面
  if (hoverIndex !== null && !mouseIdle) return;          // 只有"鼠标刚动过"才压住轮切 ✓
  if (now - lastRotateAt < rotateMsFor(tabIndex)) return; // 停留时长按当前面板取
  lastRotateAt = now;
  nextTab(1);
}
setInterval(rotateTick, 250);
// ★ 心跳（2026-10-26 排查"自动轮切失效"）：每 3 秒把「当前面板 / 悬停 / 键盘锁」报给屏幕服务，
//   落盘到 ~/qyn/logs/screen-beat.json ⇒ 远程就能判断轮切有没有在动（不用靠肉眼 ✗）。
//   ★ 任何失败都**绝不能**影响画面（try/catch + fetch catch）✓
if (typeof fetch === "function") {
  setInterval(() => {
    try {
      fetch("/beat?tab=" + tabIndex + "&hover=" + (hoverIndex === null ? "" : hoverIndex) +
            "&kbd=" + (kbdLockedNow() ? 1 : 0), { cache: "no-store", keepalive: true })
        .catch(() => {});
    } catch (e) { /* 心跳挂了也不许影响轮切 ✓ */ }
  }, 3000);
}

// 左上角标题中英轮换（用户 2026-10-15 防烧屏；2026-10-18 改：中文是手写字、
// 动效改成"书写 / 滑入"）。两态都是**常驻 DOM**，只切 `is-cn` / `is-en` 类 ——
// 切到中文时再给图片重放一次 `write` 动画（摘类 → 强制回流 → 加回）。
const TITLE_STATES = ["is-cn", "is-en"];
const T0 = Date.now();
let titleTick = 0;
let titleIdx = 0;
function flipTitle() {
  titleIdx = (titleIdx + 1) % TITLE_STATES.length;
  const el = document.getElementById("title");
  if (!el) return;
  const cn = (titleIdx === 0);
  el.className = cn ? "is-cn" : "is-en";
  const img = (typeof el.querySelector === "function") ? el.querySelector(".t-cn") : null;
  if (img) {
    // ★ 只能动 `write`，**绝不能把 `t-cn` 清掉** —— 那是背景图（手写字）的类，
    //   清掉它切回中文时标题就变空白 ✗（这里踩过一次，所以有专门的断言钉着）。
    img.className = "t-cn";                      // 摘掉 write，动画才能重放
    if (cn) {
      void img.offsetWidth;                      // 强制回流（测试替身没有这个属性也没关系）
      img.className = "t-cn write";
    }
  }
}

render();
renderTime();
renderAgent();
// ★★ 初始化**逐步隔离**（用户 2026-10-17："键盘展开整个崩了"）：
//   原来这九步是**裸着顺序执行**的 —— 任何一步抛错，后面的步骤（**包括 bindTabs 里注册的
//   键盘监听**）就再也不会注册 ⇒ 现象是"所有键全死"。24×7 的墙上不能有这种单点。
//   现在：① 每步独立 try/catch；② `bindTabs` **提到最前**（键盘优先保住）；
//   ③ 失败的步骤记下来，并在顶栏显示"⚠ 初始化 N 步失败"（悬停可看原因）。
const INIT_ERRORS = [];
function safeInit(name, fn) {
  try { fn(); } catch (err) { INIT_ERRORS.push(name + ": " + err); }
}
safeInit("bindKeys", bindKeys);            // ← **唯一的**键盘监听器（最先保住 ✓）
safeInit("bindTabs", bindTabs);
safeInit("applyTabs", applyTabs);
safeInit("bindTimeBoxes", bindTimeBoxes);
safeInit("bindSettings", bindSettings);
safeInit("renderSettings", renderSettings);
safeInit("bindChat", bindChat);
safeInit("bindMasters", bindMasters);      // 主警告/主错误：按下复位
safeInit("connect", connect);
safeInit("loadTime", loadTime);
safeInit("loadAgent", loadAgent);
if (INIT_ERRORS.length) {
  const conn = document.getElementById("conn");
  if (conn) {
    conn.textContent = "⚠ 初始化 " + INIT_ERRORS.length + " 步失败";
    conn.title = INIT_ERRORS.join("\n");
  }
}
</script>
<script>
// ★★ 2026-11-06：**唯一的闪烁时钟**。所有 .blink-* / .red-blink / .u-red-blink 都只看
//   body.flash-on 这一个开关 ⇒ 无论元素什么时候被创建、什么时候被重绘，相位永远一致。
//   原来每个元素各挂一条 CSS animation，从"加上类那一刻"起跳 ⇒ 永远对不上。
(function () {
  var on = false;
  setInterval(function () {
    on = !on;
    document.body.classList.toggle('flash-on', on);
  }, 450);
})();
</script>
</body>
</html>
