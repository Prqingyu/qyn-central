  const c = v >= b ? "bad" : (v >= w ? "warn" : "");
  return `<div class="bar ${c}"><i style="width:${v}%"></i></div>`;
}
// 数据年龄。调用点只有 stateLabel，而它保证传入 >= 10 秒
// —— 所以这里**没有"刚刚"这一档**（用户 2026-10-13：新鲜时那一格留白）。
function age(sec) {
  if (sec < 60) return Math.round(sec) + " 秒前";
  if (sec < 3600) return Math.round(sec / 60) + " 分钟前";
  if (sec < 86400) return Math.round(sec / 3600) + " 小时前";
  return Math.round(sec / 86400) + " 天前";
}
// 陈旧度按服务端时间戳在前端实时算：快照里的 stale_seconds 只会越来越旧
function staleness(s) {
  const recv = Number(s.received_at);
  if (!isFinite(recv)) return Number(s.stale_seconds) || 0;
  return Math.max(0, Date.now() / 1000 - recv);
}

// ── 一张机器卡（CPU / TEMP / RAM，按用户要求不要磁盘）────────────────────
function card(m) {
  const s = nodes.get(m.id);

  if (!s) {
    return `
      <div class="card none">
        <div class="card-head">
          ${mnameHtml(m.name, m.short)}
          <span class="mnote">${m.note}</span>
          <span class="state">未上报</span>
        </div>
        <div class="empty">这台机器还没装采集器</div>
      </div>`;
  }

  const label = stateLabel(s);

  const cpu = s.cpu || {}, mem = s.mem || {};
  const memTxt = (mem.used_mb && mem.total_mb)
    ? (mem.used_mb / 1024).toFixed(1) + " / " + (mem.total_mb / 1024).toFixed(1) + " GB" : "";
  // TEMP：Windows 上由 LibreHardwareMonitor 的库读（要提权）；读不到就显示 "—"
  // 三个读数都**不带单位**（用户 2026-10-13 定）：数字给人看量级
  const hasTemp = (cpu.temp_c !== null && cpu.temp_c !== undefined);
  const tempTxt = hasTemp ? fmt(cpu.temp_c, 0) : "—";

  // 分级阈值全部来自**设置界面**（默认 CPU/RAM 75/90；温度墙 85/95，用户 2026-10-13 定）
  const lvCpu = levelOf(cpu.pct, setting("cpuWarn"), setting("cpuBad"));
  const lvTemp = levelOf(cpu.temp_c, setting("tempWarn"), setting("tempBad"));
  const lvRam = levelOf(mem.used_pct, setting("ramWarn"), setting("ramBad"));
  // 任意一项黄/红 ⇒ 整块左边的竖线变色
  const worst = Math.max(lvCpu, lvTemp, lvRam, staleLevel(s));
  lightSet("dc:" + m.id, m.name, clsOf(worst));     // ★ 灯：机器卡（DATACENTER）
  // 断联 ≥10s（当关机）：**数据区整个换成 OFFLINE**，冻结的数值一个都不显示
  const off = staleLevel(s) === LV_OFF;

  return `
    <div class="card ${clsOf(worst)}${focusBox === "dc-" + m.id ? " focus" : ""}">
      <div class="card-head">
        ${mnameHtml(m.name, m.short)}
        <span class="mnote">${m.note}</span>
        <span class="state">${label}</span>
      </div>
      ${off ? offlineBody() : `      <div class="rows">
        <div class="row">
          <span class="k">CPU</span>
          <span class="v ${vcls(lvCpu)}">${fmt(cpu.pct, 0)}</span>
          <!-- cpu.cores 是**逻辑处理器数 = 线程数**（psutil logical / NumberOfLogicalProcessors），
               不是示例课程核心数 —— MAIN 是 多核，所以这里必须写 THREADS。
               用户 2026-10-13 指出之前显示"32 核"多了一倍。 -->
          <span class="extra">${cpu.cores ? cpu.cores + " THREADS" : ""}</span>
        </div>
        ${bar(cpu.pct)}
        <div class="row">
          <span class="k">TEMP</span>
          <span class="v ${vcls(lvTemp)}">${tempTxt}</span>
          <span class="extra"></span>
        </div>
        ${bar(hasTemp ? cpu.temp_c : 0, setting("tempWarn"), setting("tempBad"))}
        <div class="row">
          <span class="k">RAM</span>
          <span class="v ${vcls(lvRam)}">${fmt(mem.used_pct, 0)}</span>
          <span class="extra">${memTxt}</span>
        </div>
        ${bar(mem.used_pct)}
      </div>`}
    </div>`;
}

// ── 名字：展开用全名，收起用短名（用户 2026-10-14）─────────────────────────
// 两个名字**都渲染出来**，靠 CSS 切换（.mfull / .mabbr）—— 这样"收起"依然只是换一个 class，
// 不需要为了改名而重渲染。
// 短名规则：机器名取首字母 + 保留网卡部分 ⇒ "MAIN LAN" → "M LAN"、"MAIN WLAN" → "M WLAN"；
// 机器自己的短名（如 WORKSTATION → WS）在 MACHINES 里显式给。
function abbrName(m, suffix) {
  const base = m.short || m.name;
  if (!suffix) return m.short || "";
  return base.charAt(0) + " " + suffix;
}
function mnameHtml(full, short) {
  if (!short || short === full) return `<span class="mname">${full}</span>`;
  return `<span class="mname"><span class="mfull">${full}</span>` +
         `<span class="mabbr">${short}</span></span>`;
}

// 在线 / 丢失 / 离线 —— 两块面板共用（数据新鲜度）
// 颜色不在这里决定：竖线颜色 = 新鲜度与各项数值里最坏的那个（见 levelOf/staleLevel）
// 用户 2026-10-13/14：在线写 **OL**、不显示"刚刚"；丢连接写 **LOST**；关机写 **OFFLINE**。
// ★ 紧凑时长（2026-11-05）：卡头很窄，`OFFLINE · 14 分钟前` 会被截成 `14 …` ✗
//   ⇒ 状态里用 `11s / 14m / 3h / 2d`（和 DUE 的 `(4d)` 同一套紧凑写法 ✓），
//     完整说法仍留给别处（`.mnote` / 详情），状态这一格优先"整词可见" ✓
function ageShort(sec) {
  if (sec < 60) return Math.round(sec) + "s";
  if (sec < 3600) return Math.round(sec / 60) + "m";
  if (sec < 86400) return Math.round(sec / 3600) + "h";
  return Math.round(sec / 86400) + "d";
}
function stateLabel(s) {
  const stale = staleness(s);
  if (stale >= STALE_OFF_S) return "OFFLINE · " + ageShort(stale);
  if (stale >= STALE_WARN_S) return "LOST · " + ageShort(stale);
  return "OL";
}

// 数据区被"关机"盖掉时的占位 —— 冻结的数值一律不显示
function offlineBody() { return '<div class="offline">OFFLINE</div>'; }

// ── 颜色分级（用户 2026-10-13 定的显示逻辑）───────────────────────────────
//   · 温度墙：85–95 黄区，>95 红区
//   · CPU / RAM：沿用 75 黄 / 90 红
//   · 速率：**任意一项为 0 就标红**（0 = 这条链路没动静）
//   · 大模块里任意一项黄/红 ⇒ 它左边那条竖线也跟着变色（绿→黄→红）
//   · 超范围的数字在**白 ↔ 黄/红之间闪烁**（见 CSS 的 blink-*）
//   · 断联：≥5s 黄、≥10s **灰（OFF）** —— 见 staleLevel
const LV_OK = 0, LV_WARN = 1, LV_BAD = 2, LV_OFF = 3;

// ── 灯（lamp）系统（用户 2026-10-18：飞机驾驶舱）─────────────────────────────
// 全墙只有**四态**：绿 ok / 黄 warn / 红 bad / **不亮** off（离线 = 没电，不是告警）。
// 设计目标：所有系统正常时，**整面墙除了绿色之外没有任何颜色**。
// 每个模块渲染时调 lightSet(id, 标签, 状态) 登记自己；lightSummary() 汇总出最坏状态 ⇒
// 将来的「主警告（红）」「主错误（黄）」两盏主灯直接读它，**不用再各算一遍**（一份实现 ✓）。
const LAMP_RANK = { off: 0, ok: 1, warn: 2, bad: 3 };
const LIGHT_MODULES = new Map();          // id -> { id, label, state, since, ts }
const LIGHT_STALE_MS = 10000;             // 超过这么久没登记的模块，按「不亮」看待（渲染停了）
// ★ 因果屏蔽表（用户 2026-10-18）：按下主灯 ⇒ 屏蔽**最近一个**同级致因。
//   键 = 模块 id，值 = 被按掉的那一次的**因果编号 since** —— 只隔断"这一次"，
//   模块状态一变 since 就变 ⇒ 屏蔽自动失效（新亮的警告照样能点亮主灯 ✓）。
const LIGHT_SUPPRESSED = new Map();
let lightSeq = 0;                         // 因果编号发生器（单调递增，便于"最近"比较）

function lightSet(id, label, state) {
  const s = Object.prototype.hasOwnProperty.call(LAMP_RANK, state) ? state : "ok";
  const prev = LIGHT_MODULES.get(id);
  // ★ **状态没变就沿用原来的 since**（心跳不清因果号）—— 否则每 1.5s 一次重画会把屏蔽冲掉 ✗
  const since = (prev && prev.state === s && prev.since) ? prev.since : ++lightSeq;
  LIGHT_MODULES.set(id, { id: id, label: label || id, state: s, since: since, ts: Date.now() });
}
function lightWorse(a, b) { return (LAMP_RANK[b] > LAMP_RANK[a]) ? b : a; }
/** 汇总：**离线（off）不参与告警** —— 没电不是故障（用户 2026-10-18 明确设定）。 */
function lightSummary() {
  const now = Date.now();
  // 先清掉过期的屏蔽（模块没了、或它已经不是"那一次"了 ⇒ 屏蔽作废）
  for (const [id, since] of Array.from(LIGHT_SUPPRESSED)) {
    const m = LIGHT_MODULES.get(id);
    if (!m || m.since !== since) LIGHT_SUPPRESSED.delete(id);
  }
  const all = [];
  let worst = "ok";
  for (const m of LIGHT_MODULES.values()) {
    const st = (now - (m.ts || 0) > LIGHT_STALE_MS) ? "off" : m.state;   // 掉帧的模块 = 不亮
    const suppressed = (st !== "off") && (LIGHT_SUPPRESSED.get(m.id) === m.since);
    all.push({ id: m.id, label: m.label, state: st, since: m.since, suppressed: suppressed });
    if (st === "off" || suppressed) continue;      // 没电 / 这一次因果已按掉 ⇒ 不参与主灯
    worst = lightWorse(worst, st);
  }
  return {
    worst: worst,
    masterWarning: worst === "bad",                  // 主警告（红）：立刻处理
    masterError: worst === "warn",                   // 主错误（黄）：需要注意
    bad: all.filter(m => m.state === "bad"),
    warn: all.filter(m => m.state === "warn"),
    off: all.filter(m => m.state === "off"),
    suppressed: all.filter(m => m.suppressed),
    all: all,
  };
}

/** 按下主灯：屏蔽**最近一个**同级致因（只隔断这一次），返回被屏蔽模块的标签。 */
function lightSuppressNewest(kind) {
  const now = Date.now();
  let best = null;
  for (const m of LIGHT_MODULES.values()) {
    if ((now - (m.ts || 0) > LIGHT_STALE_MS) || m.state !== kind) continue;
    if (LIGHT_SUPPRESSED.get(m.id) === m.since) continue;      // 已经按掉的不再重复
    if (!best || (m.since || 0) > (best.since || 0)) best = m; // 取**最近**的那一次
  }
  if (best) LIGHT_SUPPRESSED.set(best.id, best.since);
  return best ? best.label : null;
}

// ── 主警告 / 主错误（用户 2026-10-18；样式照波音 MASTER WARNING / MASTER CAUTION）──
// 真实件：**按下 = 复位**（push to reset），但那样会"全灭" ✗ —— 我们要的是：
//   **按下 ⇒ 屏蔽「最近一个」导致它亮起的因素** —— 临时、只隔断这一次因果，
//   不影响后续：模块状态一变（那是新的因果）就恢复生效，**新亮的警告照样能点亮主灯** ✓。
// ★ 被按掉的项数**直接做成按钮角标**（墙上没人悬停 ✗）：还有致因 ⇒ 灯亮 + 角标；全被按掉 ⇒
//   灯变 `muted`（暗，但**不是"没问题"**）+ 角标 ⇒ 一眼能分清"真没事"和"被压住了" ✓。
// 数据只取 lightSummary()（灯系统的唯一汇总出口）⇒ 不另算一遍，也不会漏掉新模块 ✓。
// ★ 被按掉的项**直接显示在按钮上**（墙上没人会去悬停 ✗ —— 用户 2026-10-18 提醒）：
//   角标 = "还压着几项"；灯另有第三种状态 `muted`（按掉了、但原因还在 ⇒ 暗着，**不装作正常**）。
//   `title` 只是顺手给的文字说明，**不作为唯一信息源** ✓。
let masterLastPress = "";            // 最近一次按掉的是谁（写进 title，便于事后追溯）

function renderMasters() {
  const s = lightSummary();
  const paint = (id, nid, kind, sev) => {
    const el = document.getElementById(id);
    if (!el) return;
    const own = (sev === "bad" ? s.bad : s.warn);
    const rest = own.filter(m => !m.suppressed);       // 还亮着的致因
    const hid = own.length - rest.length;              // 被按掉的项数
    el.className = "master " + kind + (rest.length ? " lit" : (hid ? " muted" : ""));
    const n = document.getElementById(nid);
    if (n) n.textContent = hid ? String(hid) : "";     // 角标：空的就靠 .mk:empty 隐藏
    el.title = (sev === "bad" ? "主警告（红）" : "主错误（黄）") +
      (rest.length ? "：" + rest.slice(0, 6).map(m => m.label).join("、") : "：无") +
      (hid ? " · 已按掉 " + hid + " 项" : "") +
      (masterLastPress ? " · 最近按掉：" + masterLastPress : "");
  };
  paint("m-warning", "m-warning-n", "warning", "bad");
  paint("m-caution", "m-caution-n", "caution", "warn");
}
function bindMasters() {
  const kinds = { "m-warning": "bad", "m-caution": "warn" };
  Object.keys(kinds).forEach((id) => {
    const el = document.getElementById(id);
    if (!el || typeof el.addEventListener !== "function") return;
    el.addEventListener("click", () => {
      const label = lightSuppressNewest(kinds[id]);    // ★ 屏蔽最近一个同级致因
      if (label) masterLastPress = label;
      renderMasters();
    });
  });
}

function levelOf(v, warn, bad) {
  if (v === null || v === undefined) return LV_OK;
  const n = Number(v);
  if (!isFinite(n)) return LV_OK;
  if (n >= bad) return LV_BAD;
  if (n >= warn) return LV_WARN;
  return LV_OK;
}
function staleLevel(s) {
  const stale = staleness(s);
  if (stale >= STALE_OFF_S) return LV_OFF;
  if (stale >= STALE_WARN_S) return LV_WARN;
  return LV_OK;
}
// 大模块左边竖线的类名（绿 / 黄 / 红 / 灰）
function clsOf(lv) {
  if (lv === LV_OFF) return "off";
  if (lv === LV_BAD) return "bad";
  if (lv === LV_WARN) return "warn";
  return "ok";
}
// 数字的闪烁类名
function vcls(lv) { return lv === LV_BAD ? "blink-bad" : (lv === LV_WARN ? "blink-warn" : ""); }

// ── NETWORK：速率格式化 ───────────────────────────────────────────────────
// （原先这里还有"满量程 100 Mbps 的进度条"，用户 2026-10-13 让删掉：
//   千兆网卡下几 kbps 的日常流量条几乎是空的，等于没画，空间不如给字号。）
function rate(v) {
  if (v === null || v === undefined) return "—";
  const n = Number(v);
  if (!isFinite(n)) return "—";
  if (n >= 1000000) return (n / 1000000).toFixed(1) + "G";
  if (n >= 1000) return (n / 1000).toFixed(1) + "M";
  return n.toFixed(1) + "k";
}

// 速率为 0 ⇒ 红（用户 2026-10-13："任意一项速率为0时要标红"）。
// 注意：机器空闲时速率天然接近 0（会四舍五入成 0.0）⇒ 空闲的接口会红字闪烁。
// 这是用户明确要的语义："0 = 这条链路没动静"。
function rateLevel(v) {
  if (v === null || v === undefined) return LV_OK;
  const n = Number(v);
  if (!isFinite(n)) return LV_OK;
  return n === 0 ? LV_BAD : LV_OK;
}

// 哪些网卡走的是**外网**（下半区）。MAIN 的 WLAN 接的是校园网，其余都算内网。
// 用户 2026-10-13 指定："MAIN WLAN 放在下面"。
// 判据以后可以改成"网卡 IP 不在内网段"，但那要采集器先上报 IP —— 先按名字写死。
const INTERNET_IFACES = { "win-dev": ["WLAN"] };

function ifacesOf(s) { return (s.net && s.net.ifaces) || []; }

// 内网侧的网卡（排除走外网的那张）
function intranetIfaces(s, id) {
  const skip = INTERNET_IFACES[id] || [];
  return ifacesOf(s).filter(i => skip.indexOf(i.name) < 0);
}

// 一张或多张网卡的合计速率；一张都没数据就返回 null（**不能当 0**，0 是要标红的）
function sumRate(list, key) {
  let sum = 0, any = false;
  for (const i of list) {
    const v = i[key];
    if (v === null || v === undefined) continue;
    any = true;
    sum += Number(v);
  }
  return any ? Math.round(sum * 10) / 10 : null;
}

// 延迟分级（到内网网关）。★ 这是**告警参数**，不只是显示：阈值来自设置界面。
//   undefined = 这块根本不测延迟（比如外网链路块），不参与告警。
function latLevel(v) {
  if (v === undefined) return LV_OK;
  if (v === null) return LV_BAD;
  const n = Number(v);
  if (!isFinite(n)) return LV_BAD;
  if (n >= setting("pingBad")) return LV_BAD;
  if (n >= setting("pingWarn")) return LV_WARN;
  return LV_OK;
}

// 大模块的级别 = 数据新鲜度 与 块内速率/延迟 里最坏的那个 ⇒ 左边竖线跟着变色
function netLevel(s, up, down, latv) {
  return Math.max(staleLevel(s), rateLevel(up), rateLevel(down), latLevel(latv));
}

// 框高按内容给权重：PING 已经挪到 UP 行右边，所以只有 2 行（UP / DOWN）；
// WORKSTATION 多预留一行 BMC（用户要求，那里以后放 BMC 的 ping）
function netWeight(m) {
  const rows = (m && m.id === "storage") ? 3 : 2;
  return 40 + 24 * rows;
}

// 延迟显示。★ 0 **不是"没数据"**：LAN 网关的往返本来就在 1ms 以下，而 Windows 的
// .NET Ping 只报整数毫秒 ⇒ 亚毫秒只能显示成 0。所以 0 写成 "<1ms"，
// 和"真的没有数据"的 "—" 区分开（用户 2026-10-13 问过这个）。
function lat(v) {
  if (v === null || v === undefined) return "—";
  const n = Number(v);
  if (!isFinite(n)) return "—";
  if (n < 1) return "<1ms";
  return n.toFixed(1) + "ms";
}

// 这台机器有没有走外网的网卡（有 ⇒ 内网那块要标成 "MAIN LAN" 以区别于 "MAIN WLAN"）
function hasInternet(id) { return (INTERNET_IFACES[id] || []).length > 0; }

function rateRow(key, v) {
  return `
      <div class="row net">
        <span class="k">${key}</span>
        <span class="v ${vcls(rateLevel(v))}">${rate(v)}</span>
      </div>`;
}

// 上半区：每台机器一块（只算内网侧网卡）。
// 标题默认只有机器名；**只有同时有外网网卡的机器**才加 " LAN" 后缀，
// 否则上下两块都叫 MAIN，分不清（用户 2026-10-13：上 MAIN LAN / 下 MAIN WLAN）。
// PING 放在 UP 行右边的空隙里，不再单独占一行。
function netBlock(m) {
  const s = nodes.get(m.id);
  const internet = hasInternet(m.id);
  const title = m.name + (internet ? " LAN" : "");
  const shortTitle = internet ? abbrName(m, "LAN") : (m.short || "");
  if (!s) {
    // 没上报也把位置占住：storage 多留一行 BMC（那台以后靠 BMC/IPMI 唤醒与探测）
    const bmcRow = (m.id === "storage")
      ? '<div class="row net"><span class="k">BMC</span><span class="v">—</span></div>' : "";
    return `
      <div class="netcard none" style="flex-grow: ${netWeight(m)}">
        <div class="card-head">
          ${mnameHtml(title, shortTitle)}
          <span class="state">未上报</span>
        </div>
        <div class="body">
          <div class="rates">
            <div class="row net"><span class="k">UP</span><span class="v">—</span></div>
            <div class="row net"><span class="k">DOWN</span><span class="v">—</span></div>
            ${bmcRow}
          </div>
          <div class="pingbox">
            <span class="k">PING</span>
            <span class="v">—</span>
          </div>
        </div>
      </div>`;
  }
  const list = intranetIfaces(s, m.id);
  const up = sumRate(list, "tx_kbps");
  const down = sumRate(list, "rx_kbps");
  const latv = (s.net && s.net.latency_ms !== undefined) ? s.net.latency_ms : null;
  // 断联 ≥10s（当关机）：数据区整个换成 OFFLINE，冻结的速率/延迟都不显示
  const off = staleLevel(s) === LV_OFF;
  const lvNet = netLevel(s, up, down, latv);
  lightSet("net:" + m.id, m.name, clsOf(lvNet));    // ★ 灯：网卡（NETWORK 内网）
  return `
    <div class="netcard ${clsOf(lvNet)}${focusBox === "net-" + m.id ? " focus" : ""}" style="flex-grow: ${netWeight(m)}">
      <div class="card-head">
        ${mnameHtml(title, shortTitle)}
        <span class="state">${stateLabel(s)}</span>
      </div>
      ${off ? offlineBody() : `
      <div class="body">
        <div class="rates">
          ${rateRow("UP", up)}
          ${rateRow("DOWN", down)}
        </div>
        <div class="pingbox rate-ping">
          <span class="k">PING</span>
          <span class="v ${vcls(latLevel(latv))}">${lat(latv)}</span>
        </div>
      </div>`}
    </div>`;
}

// 下半区：走外网的链路（MAIN 的 WLAN）+ 出口。
// 标题 = 机器名 + 网卡名（"MAIN WLAN"）—— 这里必须写，否则和上面的 MAIN LAN 重名。
function internetBlocks() {
  const out = [];
  for (const m of MACHINES) {
    const s = nodes.get(m.id);
    if (!s) continue;
    for (const name of (INTERNET_IFACES[m.id] || [])) {
      const i = ifacesOf(s).find(x => x.name === name);
      if (!i) continue;
      out.push(`
        <div class="netcard ${clsOf(Math.max(staleLevel(s), rateLevel(i.tx_kbps), rateLevel(i.rx_kbps)))}" style="flex-grow: 110">
          <div class="card-head">
            ${mnameHtml(`${m.name} ${name}`, abbrName(m, name))}
            <span class="state">${stateLabel(s)}</span>
          </div>
          ${staleLevel(s) === LV_OFF ? offlineBody() : `
          <div class="body">
            <div class="rates">
              ${rateRow("UP", i.tx_kbps)}
              ${rateRow("DOWN", i.rx_kbps)}
            </div>
          </div>`}
        </div>`);
    }
  }
  out.push(wanBlock());
  return out.join("");
}

// 出口（整个内网 ↔ 外网）：显示**通断性**，不显示速率（用户 2026-10-13 定的方向）。
// 为什么不做速率：路由器是 上游路由器固件 —— 既没有 SNMP 也没有 SSH
// （官方规格里网络协议/管理维护都没有，UDP 161 实测也无响应），拿不到 WAN 字节计数。
// 数据来源是**中控机**对公网的探测：出口是全内网共用的一条路，
// 而 MAIN 的 WiFi 走校园网、不经过这个出口，所以不能拿它来代表出口。
const WAN_PROBE_NODE = "central";

// 公网 PING 的分级：内网那套对公网太严（公网正常就几十 ms）—— 阈值也走设置界面
function wanLatLevel(v) {
  if (v === undefined || v === null) return LV_BAD;
  const n = Number(v);
  if (!isFinite(n)) return LV_BAD;
  if (n >= setting("wanBad")) return LV_BAD;
  if (n >= setting("wanWarn")) return LV_WARN;
  return LV_OK;
}

function wanBlock() {
  const s = nodes.get(WAN_PROBE_NODE);
  const w = s && s.net && s.net.wan;
  if (!w) {
    return `
      <div class="netcard none" style="flex-grow: 110">
        <div class="card-head">
          <span class="mname">WAN</span>
          <span class="state">无数据</span>
        </div>
        <div class="body">
          <div class="rates">
            <div class="row net"><span class="k">LOSS</span><span class="v">—</span></div>
          </div>
        </div>
      </div>`;
  }
  const ok = w.ok === true;
  // 探测源（中控机）自己断联 ≥10s ⇒ 这块没有可信数据，同样盖成 OFFLINE
  const off = staleLevel(s) === LV_OFF;
  const loss = (w.loss_pct === null || w.loss_pct === undefined) ? null : Number(w.loss_pct);
  // 丢包：0 正常、有丢包黄、一半以上红；整条不通直接红
  let lvLoss = LV_OK;
  if (!ok) lvLoss = LV_BAD;
  else if (loss !== null && loss >= 50) lvLoss = LV_BAD;
  else if (loss !== null && loss > 0) lvLoss = LV_WARN;
  const lvLat = ok ? wanLatLevel(w.latency_ms) : LV_BAD;
  const lv = Math.max(lvLoss, lvLat, staleLevel(s));
  lightSet("net:wan", "WAN", clsOf(lv));            // ★ 灯：外网/出口
  return `
    <div class="netcard ${clsOf(lv)}" style="flex-grow: 110">
      <div class="card-head">
        <span class="mname">WAN</span>
        <span class="state">${off ? stateLabel(s) : (ok ? "OK" : "断网")}</span>
      </div>
      ${off ? offlineBody() : `
      <!-- LOSS 与 PING 左右**对称**：同样 28px、各占一半、各自居中
           （用户 2026-10-13：要和 PING 一样大、放左边，视觉才平衡） -->
      <div class="body dual">
        <div class="pingbox">
          <span class="k">LOSS</span>
          <span class="v ${vcls(lvLoss)}">${loss === null ? "—" : loss.toFixed(0) + "%"}</span>
        </div>
        <div class="pingbox wan-ping">
          <span class="k">PING</span>
          <span class="v ${vcls(lvLat)}">${ok ? lat(w.latency_ms) : "—"}</span>
        </div>
      </div>`}
    </div>`;
}

// ── 渲染 ──────────────────────────────────────────────────────────────────
// ── SERVICE 面板：OpenCode 余额（第一个子块）──────────────────────────────
// 数据来自 Windows 侧推上来的 `svc-opencode` 样本（`payload.frame` = apiusage 的一帧）。
// ★ 契约见 OPENCODEGO/apiusage/docs/INTERFACE.md —— 那边把业务规则都算好了，这边**只渲染**：
//   · 上色/进度条只用 `usable_percent`（**不是** remaining_percent）与 `level`
//   · 阈值读 `frame.thresholds`，**不硬编码 15 / 5**
//   · `usable_percent: null` = 没数据（**不是 0%**）；`has_go:false` + 空 meters = 正常状态
//   · 新鲜度看 `fresh_for_ms`（超过就该显示"数据陈旧"）
const SERVICE_NODE = "svc-opencode";
const EGRESS_NODE = "svc-egress";   // 中控机出口探测（CENTRAL/scripts/egress-probe.sh 推的）
// ★ 状态词表（用户 2026-10-18："SERVICE 界面的 OL 又变成正常了，改回去"）——
//   全墙统一用 **OL / OF** 这套词：ok ⇒ `OL` ✓、critical ⇒ `OF` ✓（偏低的余额仍写"偏低" ✓）
const SVC_COLOR = { ok: "var(--ok)", warn: "var(--warn)", critical: "var(--bad)", unknown: "var(--faint)" };
const SVC_LABEL = { ok: "OL", warn: "偏低", critical: "OF", unknown: "无数据" };
// svc-node 卡（AGENT / EGRESS / WECHAT 拆块）：同样的 OL/OF 词表，warn 用 `LOW` 免得混进中文金额语义
const SVC_NODE_LABEL = { ok: "OL", warn: "LOW", critical: "OF", unknown: "—" };
let svcCache = "";

// 用户 2026-10-15 定的规则：**同时只显示一个工作区**，选"剩余最少且不为 0"的那个。
// "剩余"按**金额**比 —— 契约里 `worst_window` 就是这么定的（三个池子天花板不同，比金额不比百分比）。
function svcPick(frame) {
  const list = (frame && frame.workspaces) || [];
  // ★★ 多账号轮转（用户 2026-10-21）：推送会把**当前正在用**的那个工作区标成 `in_use: true`
  //   ⇒ **优先选它**（"当前账号"必须就是中控 Agent 正在用的那个 ✓）。
  //   为什么不能再按"剩余最少"挑 ✗：两个账号轮转时，剩得少的那个**不等于**正在用的那个。
  const flagged = list.find(w => w && w.in_use === true && (w.meters || []).length);
  if (flagged) return flagged;
  let best = null, bestRem = Infinity, first = null;
  list.forEach(ws => {
    if (!first) first = ws;
    const meters = ws.meters || [];
    if (!meters.length) return;                       // 没有 GO 订阅 ⇒ 跳过（正常状态，不是错误）
    let rem = Infinity;
    meters.forEach(m => {
      const r = (typeof m.remaining_usd === "number") ? m.remaining_usd : Infinity;
      if (r < rem) rem = r;
    });
    if (!isFinite(rem) || rem <= 0) return;           // 已用尽的不选
    if (rem < bestRem) { bestRem = rem; best = ws; }
  });
  return best || first;                               // 全都用尽 ⇒ 退到第一个（至少显示点东西）
}

// 契约的 level → 监视栏那套 class（卡片左竖线 + 进度条颜色都用它，**不复算**）
const SVC_CARD = { ok: "ok", warn: "warn", critical: "bad", unknown: "none" };
// 进度条：**复用监视栏的 .bar 样式**（用户 2026-10-15：风格要统一）。
// ★★ 方向：**填满 = 用光**（用户 2026-10-15 选定）⇒ 条宽取 `100 - usable_percent`。
//   这是唯一一处"不直接用契约字段"的地方 —— 颜色仍严格取自契约的 `level`（**不复算等级**）。
//   ⚠ 契约 INTERFACE.md 写的是"算进度条用 usable_percent"；这里是有意偏离（数字那格已经
//     明写"剩77%"不会误读），已记进 screen/README.md，避免以后被当成 bug 改回去。
function svcBar(pct, level) {
  const used = (pct === null) ? 0 : Math.max(0, Math.min(100, 100 - pct));
  // 颜色：① 契约给的 `critical`（被上层压住 / 已用尽）⇒ 红；
  //       ② **已用超过阈值（默认 80%，可在设置里改）⇒ 黄**（用户 2026-10-15）；
  //       ③ 没数据 ⇒ 灰；其余走墙上默认色。
  // 注意：等级判断仍以契约的 `level` 为准，这里只**补一条"用量"维度**，不复算它的等级。
  const c = (level === "critical") ? "bad"
          : (level === "unknown") ? "unknown"
          : (pct !== null && used > setting("svcUsedWarn")) ? "warn"
          : "";
  return '<div class="bar ' + c + '"><i style="width:' + used + '%"></i></div>';
}

// 重置时刻：契约给了 `resets_at_ms`（绝对时刻）和 `reset_in`（"1 小时 30 分后重置"）。
// 用户 2026-10-15：**直接写时刻**，不要"什么时候重置"那句话。
// 同一天只写 HH:MM；跨天（周/月那两个池子经常跨天）带上 M/D，否则光看时间会误读。
function svcResetAt(ms) {
  if (typeof ms !== "number" || !isFinite(ms)) return "";
  const d = new Date(ms);
  const now = new Date();
  const hm = String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  const sameDay = d.getFullYear() === now.getFullYear() &&
                  d.getMonth() === now.getMonth() && d.getDate() === now.getDate();
  return sameDay ? hm : (d.getMonth() + 1) + "/" + d.getDate() + " " + hm;
}

// ★ 刷新倒计时**只给天数**（用户 2026-10-18："直接一个数字加 d 就可以"）⇒ `3d`。
//   **收起态一律不显示**（连"未开始计时"这种话术也不要 ✗）；只有展开（选中）那张卡才露出来。
//   口径向上取整：还有 2 小时也写 1d，不写 0d（免得看着像"马上就没额度了"）。
function svcResetDays(ms) {
  if (typeof ms !== "number" || !isFinite(ms)) return "";
  const left = ms - Date.now();
  if (left <= 0) return "0d";
  return Math.ceil(left / 86400000) + "d";
}

function renderService() {
  const host = document.getElementById("svc-body");
  if (!host) return;
  const sample = nodes.get(SERVICE_NODE);
  const frame = sample && sample.frame;
  if (!frame) {
    // ★ 没数据也**照样是一张卡**（用户 2026-10-15："出错情况下也应该能看到"）——
    //   不然这一栏就整块消失，看起来像坏了。
    const empty = '<div class="card none">' +
      '<div class="card-head"><span class="mname">OCGO</span>' +
      '<span class="mnote">等 Windows 侧推数据…</span>' +
      '<span class="state">无数据</span></div></div>';
    if (svcCache !== empty) {
      svcCache = empty;
      host.innerHTML = empty;
    }
    return;
  }
  const ws = svcPick(frame);
  // ★ 键名统一**英文大写**（用户 2026-10-17："这里所有前面的用英文大写字母统一风格"）。
  //   按契约的 `window` 字段映射，不依赖帧里 `short` 的中文（"周"/"月"）。
  const WIN_EN = { fiveHour: "5H", week: "WK", month: "MO" };
  const winKey = (m) => WIN_EN[m.window] || String(m.short || m.label || "").toUpperCase();
  const lv = frame.level || "unknown";
  const freshMs = (typeof frame.fresh_for_ms === "number") ? frame.fresh_for_ms : 300000;
  const ageMs = (typeof frame.generated_at_ms === "number") ? (Date.now() - frame.generated_at_ms) : null;
  const staleSec = (sample && typeof sample.stale_seconds === "number") ? sample.stale_seconds : 0;
  const stale = (ageMs !== null && ageMs > freshMs) || (staleSec * 1000 > freshMs + 60000);
  const meters = (ws && ws.meters) || [];
  // 三行 = 5H / 周 / 月，每行「名称 + 百分比 + 剩余金额」，下面跟同款进度条
  const rows = meters.map(m => {
    const pct = (typeof m.usable_percent === "number") ? m.usable_percent : null;
    // 用户 2026-10-15：**只留一个百分比**，不要"剩下多少"的文字/金额。
    // 口径必须和进度条**一致** = **已用**（条填满 = 用光）—— 否则数字和条又会对不上。
    const usedTxt = (pct === null) ? "无数据" : Math.round(100 - pct) + "%";
    const blocked = m.blocked_by ? "被" + (m.blocked_by_label || m.blocked_by) + "压住" : "";
    // ★ 刷新倒计时（用户 2026-10-18）：**只写天数** `(3d)`，且**收起态不显示** ✗ ——
    //   包在 `.rstd` 里；可见性跟 `.extra`（面板收起时整列隐藏）走 ✓。
    //   ★ **5H 不显示天数**（用户 2026-10-19：5 小时窗口永远 < 1 天 ⇒ 恒为 `1d`，没意义 ✗）
    //     ⇒ 只给 WK / MO 两个窗口显示 ✓
    const days = (m.window === "fiveHour") ? "" : svcResetDays(m.resets_at_ms);
    const extra = blocked + (days ? '<span class="rstd">(' + days + ')</span>' : "");
    return '<div class="row">' +
      '<span class="k">' + svcEsc(winKey(m)) + '</span>' +
      '<span class="v">' + usedTxt + '</span>' +
      '<span class="extra">' + extra + '</span></div>' + svcBar(pct, m.level);
  }).join("");
  // ★ 第四行 = **出口通断性**（用户 2026-10-15：出口那块的信息全部不要，只留通断）。
  //   用**墙上既有的语汇**保持风格统一：在线 = `OL`，不在线 = **红色闪烁 `OF`**
  //   （复用监视栏那个 `.blink-bad` 动画，不另造一套）。
  const eg = nodes.get(EGRESS_NODE);
  // ★★ 出口那行必须认**陈旧**（HARDWARE 审查 P1：「出口无探测告警」✗）：
  //   探针一死，帧就永远停在 `level:"ok"` ⇒ 只按 level 判断会**一直显示 OL** ✗，
  //   等于"探测没了但屏幕上看着一切正常"。这里改成和其他节点同一口径：
  //   超过 `fresh_for_ms`（或墙上给的 `stale_seconds`）就算不新鲜 ⇒ 红闪 `OF`。
  const egStale = (() => {
    const f = eg && eg.frame;
    if (!f) return true;
    const freshMs = (typeof f.fresh_for_ms === "number") ? f.fresh_for_ms : 900000;
    const ageMs = (typeof f.generated_at_ms === "number") ? (Date.now() - f.generated_at_ms) : null;
    const staleSec = (eg && typeof eg.stale_seconds === "number") ? eg.stale_seconds : 0;
    return (ageMs !== null && ageMs > freshMs) || (staleSec * 1000 > freshMs + 60000);
  })();
  // ★★ 出口三态（用户 2026-10-19）：一次 5 分钟抖动不该把整块点红 ✗ ——
  //   探针侧已去抖：连续 1~2 次失败 ⇒ `warn`（黄 = 注意），≥3 次（约 15 分钟）⇒ `critical`（红）。
  //   于是这里也要认三种：`OL`（通）/ `OF` 黄（抖动，不闪）/ `OF` 红闪（真断 / 探测陈旧 / 没数据）。
  const egLv = (eg && eg.frame && eg.frame.level) || "unknown";
  const egOk = egLv === "ok" && !egStale;
  const egJitter = !egOk && !egStale && egLv === "warn";      // 抖动：黄，不点红
  const egDown = !egOk && !egJitter;                           // 真断 / 陈旧 / 没数据
  // ★★ OCGO 是**例外**（用户 2026-10-17："哪怕黄了也不动状态条，除非额度空或者不通才红"）：
  //   不跟着"用量高 ⇒ 黄"走 —— 只有**额度耗尽**（critical / 剩余 0）或**出口不通**才标红。
  const exhausted = meters.some(m => m.level === "critical") ||
    meters.some(m => typeof m.usable_percent === "number" && m.usable_percent <= 0);
  // ★ 卡的竖线 / 卡头状态词 / 灯，都是**三态**（用户 2026-10-19）：
  //   通 = 绿 `OK`；出口抖动 = 黄 `warn`；额度耗尽或出口真断 = 红。
  //   ⚠️ 别再用 `SVC_CARD[...]` 去查：它的键是**契约等级**（ok/warn/critical/unknown），
  //      传 "bad" 取不到 ⇒ 退化成 `none`（**灰**）✗ —— 这曾是个真 bug：
  //      出口真断了、OCGO 卡左边那条灯却是灰的（"没通电"的样子），视觉上和"没数据"混了。
  const ocgoLv = (egDown || exhausted) ? "bad" : (egJitter ? "warn" : "ok");
  const ocgoCard = ocgoLv;                      // 竖线：ok / warn / bad —— 直接用灯的三态 ✓
  const ocgoLabel = { ok: "OL", warn: "抖动", bad: "断开" }[ocgoLv] || ocgoLv;
  // ★ 登记到灯系统：SERVICE 的 OCGO 与出口（出口**真断**才红；抖动只到黄 ✓）
  lightSet("svc:ocgo", "OCGO", ocgoLv);
  lightSet("svc:egress", "出口", egOk ? "ok" : (egJitter ? "warn" : "bad"));
  // ★ 标题里带上当前工作区：大模块展开时 `OCGO WS01`，折叠时只写 `OCGO`（用户 2026-10-17）
  const svcWideHere = ((TABS[tabIndex] || {}).id === "panel-service");
  const rowsAll = rows + '<div class="row">' +
    '<span class="k">EGR</span>' +
    '<span class="v ' + (egOk ? "ok" : (egJitter ? "warn" : "bad blink-bad")) + '">' +
      (egOk ? "OL" : "OF") + '</span>' +
    '<span class="extra"></span></div>';
  // ★★ **展开态补充**（用户 2026-10-17："OCGO 展开应该展示目前工作区、通断状态、数据来源"）：
  //   显示由 CSS 决定 —— **只有被选中的那张卡**才展开这些行
  //   （`.svc .row.more{display:none}` + `.svc.focus .row.more{display:grid}`）。
  //   注意：**不是**"面板展开就露" ✗ —— 那样一切过去三张卡会全部纵向展开（用户报过 ✗）。
  const svcRow = (k, v, extra) => '<div class="row more"><span class="k">' + svcEsc(k) + '</span>' +
    '<span class="v">' + svcEsc(v) + '</span>' +
    '<span class="extra">' + svcEsc(extra || "") + '</span></div>';
  // ★ WIN 行：直推写 WIN、兜底写 CFB（用户 2026-10-17："WIN直推改成WIN" —— 值本身别再写长句）
  const ageSec = (sample && typeof sample.stale_seconds === "number") ? sample.stale_seconds : null;
  const ageTxt = (ageSec === null) ? ""
    : (ageSec < 90 ? Math.round(ageSec) + " 秒前" : Math.round(ageSec / 60) + " 分钟前");
  // ★ 金额压成**一行**（用户 2026-10-17："金额计数的三行压缩进一行，用 0.9-25-49.6 这种格式"）：
  //   去掉每窗口的额度小字（$12/$30/$60 ✗）和那三条条 —— 上面 5H/WK/MO 本来就有条。
  const usedLine = meters
    .map(m => (typeof m.used_usd === "number") ? String(Number(m.used_usd.toFixed(1))) : null)
    .filter(v => v !== null).join(" - ");
  const usedRows = usedLine ? svcRow("USED", usedLine, "") : "";
  // ★ 出口那块**只留检查时刻**（用户 2026-10-17："端点不显示"、"连续失败不要"、
  //   "出口 yes" 与上面的 `EGRESS OL` 重复 ⇒ 都不要）。其余 key 仍在隐藏的出口卡里，没丢。
  const egItems = (eg && eg.frame && eg.frame.items) || [];
  const egChk = ((egItems.find(it => it.key === "检查时刻") || {}).value) || "";
  const egRow = egChk ? svcRow("EGR", egChk, "") : "";
  // ★ 预留第二工作区（用户 2026-10-17："预留一个 WS02，到时候用完一个切另一个"）：
  //   探针里若已有第二个带 GO 的工作区就用它；没有就先占位。
  const ws2 = (frame.workspaces || []).filter(w => w.has_go && w !== ws)[0];
  // ★★ 工作区标识**不许写死**（用户 2026-10-21："两个账号两个 key，切了账号屏上状态不对" ✗）：
  //   优先 `name`；其次 `label`（但 `label` 常常就是 id 本身，那等于没名字 ⇒ 跳过）；
  //   都空 ⇒ 说明这帧是**账号级 Key** 来的（分不出工作区）= `source` 里带 key ⇒ 写 `KEY` ✓
  //   —— 以前这里写死 `WS01`/`WS02`，两个账号来回切时会**指错账号** ✗
  // ★★ 探针的**占位名**不是真标识 ⇒ 一律忽略（用户 2026-10-22："不要按key直接查 显然有问题"✗）
  //   账号级 Key 模式下老版 apiusage 会把工作区名写成 `（按 Key 直查）` ✗
  const SVC_PLACEHOLDER_RE = /按\s*key\s*直查|key\s*直查|^key$|^\(key\)$/i;
  const wsTagOf = (w) => {
    if (!w) return "";
    const nm = String(w.name || "").trim();
    const lb = String(w.label || "").trim();
    if (nm && !SVC_PLACEHOLDER_RE.test(nm)) return nm;
    if (lb && lb !== String(w.id || "") && !SVC_PLACEHOLDER_RE.test(lb)) return lb;
    if (/key/i.test(String(w.source || ""))) return "KEY";
    return "";
  };
  const wsTag = wsTagOf(ws);
  const ws2Tag = wsTagOf(ws2);
  // ★ 备用 WS 不只要名称，还要**剩余月用量 + 重置**（用户 2026-10-17），放在名称**下面一行**。
  const ws2Month = (ws2 && (ws2.meters || []).find(m => m.window === "month")) || null;
  // ★ "不被使用的账号"（用户 2026-10-21）：展开时显示它的**月额度 + 月刷新**——
  //   值 = `$剩余 百分比`（大字 ✓），右侧空挡 = `(Nd)`（收起时整列隐藏 ✓）
  const ws2Line = ws2Month
    ? [((typeof ws2Month.remaining_usd === "number")
          ? "$" + ws2Month.remaining_usd.toFixed(2) : null),
       ((typeof ws2Month.usable_percent === "number")
          ? Math.round(ws2Month.usable_percent) + "%" : null)]
        .filter(Boolean).join(" ")
    : "";
  const ws2Days = ws2Month ? svcResetDays(ws2Month.resets_at_ms) : "";
  // ★ 只有**真的存在第二个 GO 工作区**才显示 WS2 / MO 两行（用户 2026-10-21）：
  //   只有一个账号时两行都写 STANDBY 是噪音 ✗；而 WS2 以前**写死 "WS02"** ⇒ 指错账号 ✗
  const ws2Rows = ws2
    ? svcRow("WS2", ws2Tag || "STANDBY", "") +
      svcRow("MO", ws2Line || "STANDBY", ws2Days ? "(" + ws2Days + ")" : "")
    : "";
  const moreRows =
    // ★ 当前工作区已并入**标题**（展开时写 `OCGO <标识>`）⇒ 不再单开一行
    ws2Rows +
    // ★ `RES` = **数据来源**（键）✓，值二选一（用户 2026-10-17 讲清了语义，我先前整个搞反 ✗）：
    //   · `WIN` = **Windows 电脑推送**上来的（直推）
    //   · `TOK` = **本机用 token 拉取**的（即中控机兜底那条路）
    svcRow("RES", frame.fallback ? "TOK" : "WIN", ageTxt) +
    egRow +                                    // ★ EGRESS 改叫 EGR，排在金额行**上面**
    usedRows;
  // 卡片头：标题固定 **OCGO**（用户 2026-10-15：暂时不展示工作区名称）
  // 右边那格 = **重置时刻**（收起态也留着，用户 2026-10-15 要求）；陈旧时前缀标一下，
  // 但时刻照样给。
  // ★ 卡头 = 空（收起态**什么都不显示** ✓，用户 2026-10-18），展开时在同一个位置显示
  //   **月额度的刷新倒计时**（用户 2026-10-18 二次修正："标题那里应该显示月刷新"）——
  //   不是"最近一次"，也不是 5H/周：固定取 `window === "month"` 的那一格 ✓。
  //   可见性由 CSS 按"面板是否收起"决定：`.svc .rsth{display:none}` +
  //   `.panel:not(.collapsed) .svc .rsth{display:inline}` ✓
  const mMonth = meters.find(m => m.window === "month") || null;
  const monDays = mMonth ? svcResetDays(mMonth.resets_at_ms) : "";
  // ★ 用**括号**包起来（用户 2026-10-18），例如 `(18d)`
  const note = (stale ? "数据陈旧" : "") + (monDays ? '<span class="rsth">(' + monDays + ")</span>" : "");
  // ★ 第二张卡：**DeepSeek 官方 API 余额**（同一帧的 `balances[]`）——
  //   交接文档强调：**单位是人民币**（只有余额是人民币，其余金额都是美元），别混。
  const balCards = (frame.balances || []).map(b => {
    const bl = b.level || "unknown";
    const amt = (typeof b.total === "number") ? "¥" + b.total.toFixed(2) : "无数据";
    return '<div class="card ' + (SVC_CARD[bl] || "none") + '">' +
      '<div class="card-head"><span class="mname">DS API</span>' +
      '<span class="mnote">' + (b.currency || "") + '</span>' +
      '<span class="state">' + (SVC_LABEL[bl] || bl) + '</span></div>' +
      '<div class="rows"><div class="row"><span class="k">余额</span>' +
      '<span class="v">' + amt + '</span><span class="extra"></span></div>' +
      // ★ 展开态：**消费等信息**（用户 2026-10-17："DS API 展开能看到消费等信息"）——
      //   充值 / 赠送 来自 DeepSeek 余额接口的 topped_up_balance / granted_balance。
      (typeof b.topped_up === "number" ? '<div class="row more"><span class="k">充值</span>' +
        '<span class="v">¥' + b.topped_up.toFixed(2) + '</span><span class="extra"></span></div>' : "") +
      (typeof b.granted === "number" ? '<div class="row more"><span class="k">赠送</span>' +
        '<span class="v">¥' + b.granted.toFixed(2) + '</span><span class="extra"></span></div>' : "") +
      (typeof b.low_threshold === "number" ? '<div class="row more"><span class="k">低额线</span>' +
        '<span class="v">¥' + b.low_threshold.toFixed(2) + '</span><span class="extra"></span></div>' : "") +
      (b.is_available === false ? '<div class="row more"><span class="k">可用</span>' +
        '<span class="v bad">否</span><span class="extra"></span></div>' : "") +
      '</div></div>';
  }).join("");
  // ★ 灯：DS API 余额（level 由契约给：ok/warn/bad/unknown ⇒ unknown 按「不亮」）
  (frame.balances || []).forEach(b => lightSet("svc:ds", "DS API",
    (b.level === "unknown" || b.level === "none") ? "off" : (b.level || "ok")));
  const html = '<div class="card ' + ocgoCard + '">' +
    '<div class="card-head">' +
      '<span class="mname">OCGO' + (svcWideHere && wsTag ? " " + svcEsc(wsTag) : "") + '</span>' +
      '<span class="mnote">' + note + '</span>' +
      '<span class="state">' + ocgoLabel + '</span>' +
    '</div>' +
    '<div class="rows">' + (rows ? rowsAll + moreRows : '<div class="tsub">这个工作区没有 GO 订阅</div>') + '</div>' +
    '</div>';
  if (svcCache !== html) {
    svcCache = html;
    host.innerHTML = html;
  }
  // ★ 余额卡写进**另一个容器**（用户 2026-10-17：四张卡要能被键盘分别选中）。
  //   它很小且无状态，不做缓存也没关系（不像 OCGO 卡那样要保住滚动位置）。
  const ds = document.getElementById("svc-ds");
  if (ds) ds.innerHTML = balCards;
}

// ── 通用 svc-* 渲染器（用户 2026-10-16；契约见 CENTRAL/GUI/SCREEN-PROBES.md）──────
// 帧形状 = { schema, level, headline, generated_at_ms, fresh_for_ms, items:[{key,value,level}] }。
// ★ 契约的**兼容性约定**（照它写，就不会被将来的字段变化打断）：
//   · 只依赖 level / headline / generated_at_ms / fresh_for_ms / items[].{key,value,level}
//   · items[].level **可以缺** ⇒ 缺了按 ok 处理（不画色）
//   · **出现新 key 是正常演进** ⇒ 逐行渲染，**绝不做白名单过滤**
//   · `schema` 变了才算破坏性变更 ⇒ 整块降级（只显示 headline）
// ★ 风格统一：用监视栏那套 .card / .card-head / .row / .k / .v，不另造 .svc-* 样式
//   （契约第 4 节的参考实现用的是 .svc-head/.svc-row —— 那套类在"统一风格"那轮已删掉）。
// ★ 值必须转义：value 里会出现用户/课程名（契约第 4 节点名要求 escapeHtml）。
const SVC_KNOWN_SCHEMA = { "qyn.svc-agent/1": 1, "qyn.svc-egress/1": 1 };
const svcEsc = (s) => String(s == null ? "" : s)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const svcNodeCache = {};   // hostId → 上次渲染的 HTML（避免无谓重写、也保住滚动位置）
function renderSvcNode(hostId, nodeId, title, opts) {
  const box = document.getElementById(hostId);
  if (!box) return;
  const sample = nodes.get(nodeId);
  const f = sample && sample.frame;
  let html;
  if (!f) {
    // 没数据也照样一张卡（用户 2026-10-15："出错情况下也应该能看到"）
    lightSet("svc:" + hostId, title || nodeId, "off");     // ★ 灯：没数据 = 不亮
    html = '<div class="card none"><div class="card-head">' +
      '<span class="mname">' + svcEsc(title || nodeId) + '</span>' +
      '<span class="mnote">等数据…</span><span class="state">无数据</span></div></div>';
  } else {
    const freshMs = (typeof f.fresh_for_ms === "number") ? f.fresh_for_ms : 300000;
    const ageMs = (typeof f.generated_at_ms === "number") ? (Date.now() - f.generated_at_ms) : null;
    const staleSec = (sample && typeof sample.stale_seconds === "number") ? sample.stale_seconds : 0;
    const stale = (ageMs !== null && ageMs > freshMs) || (staleSec * 1000 > freshMs + 60000);
    const known = !f.schema || SVC_KNOWN_SCHEMA[f.schema] === 1;
    // ★ 一块帧拆成两个模块（用户 2026-10-16：WECHAT 专盯微信/clawbot，AGENT 放剩下的）。
    //   `keys` = 只要这几个 key；`exclude` = 除了这几个全要。
    //   ★ 关键：**新 key 不会丢** —— WECHAT 用 keys 白名单，AGENT 用 exclude（其余全收），
    //     所以探针将来加字段，它会自动出现在 AGENT 块里（契约第 2 节的精神）。
    const pick = (opts && opts.keys) ? new Set(opts.keys) : null;
    const skip = (opts && opts.exclude) ? new Set(opts.exclude) : null;
    const items = (f.items || []).filter((it) => {
      const k = it.key || "";
      if (pick) return pick.has(k);
      if (skip) return !skip.has(k);
      return true;
    });
    // ★★ 等级：**拆开的卡按自己的项算**（用户 2026-10-19）✗→✓
    //   WECHAT / AGENT 是同一帧拆出来的两卡，以前都用**整帧** level ⇒
    //   "最后一轮 退出码 1"（AGENT 的问题）会把**微信**也点红 ⇒ 看着"两个都断了" ✗。
    //   现在：做了拆分（keys / exclude）⇒ 只看自己那几项取最坏；整帧卡（EGRESS）仍用帧 level ✓。
    //   ⚠️ 这段必须在 `items` 之后算（踩过：放前面 ⇒ 引用未初始化的 const ⇒ 整页崩 ✗）。
    const LVR = { ok: 0, unknown: 0, warn: 1, bad: 2, critical: 2 };
    const ownMax = items.reduce((m, it) => Math.max(m, LVR[it.level] || 0), 0);
    const lv = (pick || skip)
      ? (ownMax === 2 ? "critical" : (ownMax === 1 ? "warn" : "ok"))
      : (f.level || "ok");
    // ★ 灯：探针类模块（WECHAT / AGENT）—— 没数据（unknown）算「不亮」
    lightSet("svc:" + hostId, title || nodeId,
      (lv === "warn") ? "warn" : ((lv === "bad" || lv === "critical") ? "bad" : (lv === "unknown" ? "off" : "ok")));
    // ★★ 收起态 = **短的衍生核心行**（用户 2026-10-17）：
    //   WECHAT ⇒ 一行（STAT 状态）；AGENT ⇒ 一行（LAST 最后一轮时间）。
    //   ★ 用户 2026-10-17 二次：**大模块展开时**把次要信息（WECHAT 的 RX / AGENT 的唤醒链下一次）
    //     塞进右侧空挡（行的第三列 .extra）⇒ **省一行**，不用再单开一行 ✗✓。
    const svcWide = ((TABS[tabIndex] || {}).id === "panel-service");
    const coreRows = (opts && typeof opts.core === "function" && known) ? opts.core(items, svcWide) : [];
    const svcCol = (lv2) => (lv2 === "warn" || lv2 === "bad") ? (SVC_COLOR[lv2] || "") : "";
    const coreHtml = coreRows.map((r) => {
      const c = svcCol(r.level);
      // ★ 右侧空挡也按惯例做**键小、值大**（用户 2026-10-17："别一行小灰字了" ✗）——
      //   例如 `RX`（小） + `10/17 02:15`（大），而不是一串 12px 灰字。
      const ex = r.exk
        ? '<span class="k">' + svcEsc(r.exk) + '</span><span class="v">' + svcEsc(r.exv || "") + '</span>'
        : "";
      return '<div class="row is-core"><span class="k">' + svcEsc(r.k) + '</span>' +
        '<span class="v"' + (c ? ' style="color:' + c + '"' : "") + '>' + svcEsc(r.v) + '</span>' +
        '<span class="extra">' + ex + '</span></div>';
    }).join("");
    const rows = known ? items.map((it) => {
      // ★ 正常项 = **白字**（用户 2026-10-17："别全是绿色" ✗），只有 warn/bad 才上色
      const c = svcCol(it.level);
      const v = (it.value === undefined || it.value === null) ? "无数据" : it.value;
      const cls = (it.level === "warn" || it.level === "bad") ? " is-bad" : "";
      return '<div class="row' + cls + '"><span class="k">' + svcEsc(it.key) + '</span>' +
        '<span class="v"' + (c ? ' style="color:' + c + '"' : "") + '>' + svcEsc(v) + '</span></div>';
    }).join("") : "";
    // 卡头 = 标题 + **帧自己的 headline**（契约：它就是给折叠态用的一行摘要）+ 等级
    // 卡头那行：默认用帧的 headline（契约说它就是给折叠态用的）；
    // ★ 但**拆出来的块**（带 keys）改用**自己第一项的 value** ——
    //   否则 WECHAT 那块会显示"最后一轮 …"（跟它没关系，用户 2026-10-16）。
    // 卡头只留标题 + 等级；**不再放 headline**（用户 2026-10-17："现在的小灰字没意义" ✗）
    // —— 核心信息改用下面那一行常显 row，看得清。
    const note = stale ? "数据陈旧" : (known ? "" : "契约已更新");
    html = '<div class="card svc-node ' + (SVC_CARD[lv] || "none") + '">' +
      '<div class="card-head">' +
        '<span class="mname">' + svcEsc(title || nodeId) + '</span>' +
        '<span class="mnote">' + svcEsc(note) + '</span>' +
        '<span class="state">' + (SVC_NODE_LABEL[lv] || lv) + '</span>' +
      '</div>' +
      '<div class="rows">' + coreHtml +
        (rows || '<div class="row is-bad"><span class="k">—</span><span class="v">' +
                 svcEsc(f.headline || "无明细") + '</span></div>') +
      '</div></div>';
  }
  if (svcNodeCache[hostId] === html) return;
  svcNodeCache[hostId] = html;
  box.innerHTML = html;
}
// 出口那块现在也只是"调用通用渲染器"（容器被 CSS 隐藏着，数据照常推）
function renderEgress() { renderSvcNode("svc-egress", EGRESS_NODE, "EGRESS"); }

function render() {
  renderService();
  renderEgress();
  // WECHAT：专盯微信 / clawbot（只要这三项）
  // ★ 收起态一行（用户 2026-10-17）：STAT = 状态、RX = 最后接收时刻（从同一条 value 里取）
  // ★★ 用户 2026-10-19：**RX 与 state 对调** —— 平时（收起态）直接看 **RX**（最后接收时刻）✓，
  //    "接收中 / 接收方 X" 挪到右侧空挡，只有展开时才看得到 ✓（"我希望在平时直接看到 RX"）
  renderSvcNode("svc-wechat", "svc-agent", "WECHAT",
    { keys: ["微信通道", "最后一条发出", "入站媒体"],
      core: (its, wide) => {
        const ch = its.find(i => i.key === "微信通道") || {};
        const v = String(ch.value || "");
        const stat = v.split(" · ")[0] || "—";
        const t = (v.match(/\d{1,2}\/\d{1,2}\s+\d{1,2}:\d{2}/) || v.match(/\d{1,2}:\d{2}/) || [""])[0];
        // ★★ 用户 2026-10-19 二次修正：**收起态只给时刻**（`20:08`），日期留到展开再显示 ✓。
        //   原因是收起态那一行太窄 ⇒ 带日期的整串会被省略成**只剩日期** ✗（"就只能看到日期了"）。
        const hm = (t.match(/\d{1,2}:\d{2}$/) || [""])[0];
        const rxVal = wide ? (t || hm) : (hm || t);
        // RX 拿不到（没收到过消息）时退回 state，别让这一行变空 ✗
        return [{ k: "RX", v: rxVal || stat, level: ch.level,
                  exk: wide ? "STAT" : "", exv: wide ? stat : "" }];
      } });
  // AGENT：剩下的全收（**新 key 自动落这里，不会丢**）
  // ★ 收起态一行（用户 2026-10-17）：LAST = 最后一轮的时刻
  renderSvcNode("svc-agent", "svc-agent", "AGENT",
    { exclude: ["微信通道", "最后一条发出", "入站媒体"],
      core: (its, wide) => {
        const r = its.find(i => i.key === "最后一轮") || {};
        const w = its.find(i => i.key === "唤醒链") || {};
        const t = (String(r.value || "").match(/\d{1,2}:\d{2}/) || [""])[0];
        // 唤醒链下一次（"下一个 10-17 11:00（…）" ⇒ "10-17 11:00"）放右侧空挡
        const nx = (String(w.value || "").match(/\d{1,2}-\d{1,2}\s+\d{1,2}:\d{2}/) || [""])[0];
        return [{ k: "LAST", v: t || "—", level: r.level,
                  exk: (wide && nx) ? "NEXT" : "", exv: (wide && nx) ? nx : "" }];
      } });
  document.getElementById("cards").innerHTML = MACHINES.map(card).join("");
  document.getElementById("net-in").innerHTML = MACHINES.map(netBlock).join("");
  document.getElementById("net-out").innerHTML = internetBlocks();
  // ★★ 灯的汇总**不许依赖"当前显示哪个面板"**（用户 2026-10-18 报的 bug：主灯随切屏忽亮忽暗 ✗）：
  //    原来 TIME/AGENT 的四个子框只在 refreshPanels()（切面板/悬停/数据到达）里登记 ⇒
  //    面板一直不切 ⇒ 它们的时间戳停在旧值 ⇒ 超过 LIGHT_STALE_MS(10s) 被判「没电」⇒
  //    主灯跟着灭；一切屏又刷回来 ⇒ 亮→灭→亮 抖。驾驶舱的主灯必须反映**所有**系统，
  //    不管你在看哪一页 ✓。这里每轮统一刷一遍 —— setBox() 有 className/innerHTML 缓存，不重画 ✓。
  renderTime();
  renderAgent();

// 帧 → AGENT 面板要的形状（**照 /api/agent 的形状拼**，所以 renderAgent 一行都不用改）。

      slots: (p.slots || []).map(s => Object.assign({}, s)),

      ok: f.level !== "bad",

// 帧 → TIME 面板要的形状（同样**照 /api/time 的形状拼**，renderTime 不用改）。
// ★ `lead_days` 只透传、**页面绝不显示**（用户口径：DDL 那行只有时间，不写"需提前 N 天"）。
function timeFromFrame(f) {

  const fb = timeFallback || {}, fbS = fb.sessions || {};
  const list = t.sessions || [];

    ok: true, from_push: true,

    },

//   返回 true = **源变了**（有推送了 / 掉回兜底了），调用方据此重画面板。
function syncPush() {
  const f = planNodeFrame();

    agentData = agentFromFrame(f);
    timeData = timeFromFrame(f);
  } else {
    agentData = agentFallback;
    timeData = timeFallback;

  const sig = f ? ("push:" + (f.generated_at_ms || 0) + ":" + (f.level || "")) : "poll";
  if (sig === pushSig) return false;
  const fellBack = pushSig.indexOf("push:") === 0 && sig === "poll";

// 推送的"守卫"：帧过期、SSE 断开都靠**时间**发现（不会再有其它的推送事件）——

function pushGuard() {
  if (syncPush()) { renderAgent(); updateReplanHint(); renderTime(); }
}

function applySnapshot(payload) {
  nodes.clear();
  (payload.nodes || []).forEach(n => nodes.set(n.node, n));
  syncPush();                          // ★ 推送主路：墙的快照里就有 agent-plan 就先采纳

// ── 实时：SSE 为主，断了退回轮询 ──────────────────────────────────────────
let pollTimer = null;
function startPolling() {
  if (pollTimer) return;

  const tick = async () => {
    try {
      const r = await fetch(WALL + "/api/state", { cache: "no-store" });
      const data = await r.json();
      // ★★ 迟到的响应**不许**覆盖已经恢复的 SSE（用户 2026-10-17 报"网络正常却降级到轮询"）：

      if (!pollTimer) return;
      applySnapshot(data);
    } catch (e) { /* 服务端没了就继续等 */ }
  };
  tick();
  pollTimer = setInterval(tick, 5000);
}
function stopPolling() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }

function connect() {
  // ★ `?snap=1`：**静态快照模式**（用户 2026-11-05 重绘主题时加）——
  //   只取一次 `/api/state` 就渲染，**不开 SSE、不轮询**。
  //   为什么需要：SSE 是长连接 ⇒ 无头浏览器（Edge/Firefox --screenshot）永远等不到
  //   "加载完成" ⇒ 截图卡死 ✗。kiosk 正常加载不带这个参数，行为完全不变 ✓。
  if (/[?&]snap=1/.test(location.search)) {
    setConn("live");
    fetch(WALL + "/api/state", { cache: "no-store" })
      .then(r => r.json())
      .then(d => { applySnapshot(d); renderAgent(); renderTime(); render(); })
      .catch(() => setConn("down"));
    return;
  }
  let es;
  try { es = new EventSource(WALL + "/api/stream"); }
  catch (e) { sseLive = false; return startPolling(); }
  es.onopen = () => { sseLive = true; stopPolling(); setConn("live"); syncPush(); renderAgent(); renderTime(); };
  es.onmessage = (ev) => {
    let msg; try { msg = JSON.parse(ev.data); } catch (e) { return; }
    if (msg.type === "snapshot") applySnapshot(msg);
    else if (msg.type === "sample" && msg.node) {
      nodes.set(msg.node.node, msg.node);
      // ★ 推送一到就重画 AGENT / TIME（不再等 20/30 秒那个轮询）—— 这就是"改成推送体系"
      if (syncPush()) { renderAgent(); updateReplanHint(); renderTime(); }
      render();
    }
  };
  es.onerror = () => {
    es.close();
    sseLive = false;               // ★ 推送不可信了 ⇒ 立刻退回轮询（绝不拿墙上的旧帧当现状）
    setConn("down"); startPolling();
    if (syncPush()) { renderAgent(); updateReplanHint(); renderTime(); }
    setTimeout(connect, 15000);
  };
}

// ── TIME 面板：接入中心的时间管理 Agent（第三栏）───────────────────────────
// 数据源（2026-10-17 起）：**主路 = 状态墙 SSE 的 `agent-plan` 帧里的 `time`**
// （due / sessions / now，数据一变就推）；**兜底 = 只读桥 :8091 的 `/api/time`**
// （它去调 AGENT 内核的只读命令 sessions / anomalies），只有没有推送/过期/SSE 断才用。

const TIME_URL = "http://127.0.0.1:8091/api/time";

// DUE 分级（用户 2026-10-15 改）：**≤6 小时 = 红 + 闪；6–12 小时 = 红；
// 12–24 小时 = 黄；更远 = 绿**。闪烁只给最紧急那一档。
function ddlCls(mins) {
  if (mins === null) return "green";
  if (mins < 360) return "red-blink";          // ≤ 6 小时：红 + 闪
  const lv = ddlLevel(mins);
  return lv === LV_BAD ? "red" : (lv === LV_WARN ? "yellow" : "green");

// DDL 分级（用户 2026-10-14 定，2026-10-15 改边界）：**≤12 小时红、12–24 小时黄、其余绿**。
// ★ 剩余时间从**内核给的 why** 里读 —— 内核已经算好了（`_fmt_span`），我们只读它的数，
//   **绝不自己算日期**（项目铁律）。
// ★ 内核的 `_fmt_span` 是**向下取整**的："12 小时" 实际是 [12,13) 小时。所以按**下界**判边界：
//   <720 分钟才红、<1440 分钟才黄 ⇒ "12 小时"落黄、"1 天"落绿，边界不会偏。

function remainMinutes(why) {

  if (!m) return null;
  const n = parseFloat(m[1]);

  if (m[2] === "分钟") return n;
  if (m[2] === "小时") return n * 60;

function ddlWhen(d) {

// ★ 为什么靠"还剩 0 分钟"判：内核的 `_fmt_span` 是**向下取整**的，`0 分钟` ⟺ 不到 60 秒

function isExpiredDdl(d) {
