<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>琴央阁信息中心</title>
<!--
  屏幕壳 v3 —— 第一块面板：DATACENTER（4 台机器，CPU / TEMP / RAM，不含磁盘与网络）
  用户 2026-10-13 定：
    · 不要磁盘信息
    · 四台机器**自上而下排在左边单栏**，右边留空（给以后的面板）
    · 网络不在这里（另开一页）
  ★ 零 CDN：所有样式与逻辑内联。
  ★ 数据来源：状态墙（http://127.0.0.1:8080），它是"数据源"，本页只负责显示。
  ★ 四台机器是**固定清单**：没上报的照样占一格、显示"未上报" —— 缺一台要看得见。
-->
<style>
  :root {
    --bg: #0f1216; --card: #171c22; --line: #242c35; --panel: #131820;
    --fg: #f0f4f8; --dim: #a3aeba; --faint: #75808d;
    --ok: #3fb950; --warn: #d29922; --bad: #f85149; --accent: #58a6ff;
    /* 灯（lamp）用的两个"不亮"色：没上报 / 离线（没电）—— 用户 2026-10-18 的驾驶舱逻辑 */
    --lamp-off: #2c343d; --lamp-dark: #3a444f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: "Noto Sans CJK SC", "Microsoft YaHei", system-ui, sans-serif;
    padding: 14px 22px; display: flex; flex-direction: column; gap: 12px;
  }

  header { display: flex; align-items: baseline; gap: 18px; }
  h1 { font-size: 28px; font-weight: 600; letter-spacing: 1px; }
  .sub { color: var(--dim); font-size: 15px; }
  .spacer { flex: 1; }
  #conn { font-size: 15px; color: var(--faint); }
  #conn.live { color: var(--ok); }
  #conn.down { color: var(--warn); }
  #clock { font-size: 30px; font-variant-numeric: tabular-nums; }
  /* ★ 日期比时刻**再大一号**（用户 2026-10-19："右上角的日期字号大一点"）——
     原来是整串同一个字号（`2026-10-19 23:33:02` 30px）✗；拆成两段 span 才能单独放大 ✓ */
  #clock .clk-d { font-size: 36px; font-weight: 600; }
  #clock .clk-t { font-size: 30px; }
  /* ★ 标题（用户 2026-10-18）：中文 = **手写字图片**（白字/透明底，内联 base64，零外链），
     英文 = 文字。两态**叠在同一格**里交叉切换（英文排前面，保证基线一直由文字决定，
     这样 conn / 时钟的垂直对齐在切换时不会跳）。
     动效：切到中文 ⇒ **书写**（mask 从左往右扫开，像笔一路写过去）；
           切到英文 ⇒ **滑入**（右移淡入）。 */
  /* ★ 顶栏布局高度**固定 36px**（用户 2026-10-18：不许被标题撑高）——
     但图片**不裁**：它绝对定位、按真实尺寸 60px 绘制，向上借 body 内距 14px、
     向下借与下方面的 12px 间距（36+12+12=60 ⇒ 刚好放得下，一个字都不切）。 */
  #title { display: grid; margin: 0; height: 36px; position: relative; }
  #title > * { grid-area: 1 / 1; align-self: center; }
  #title .t-en {
    font-size: 28px; font-weight: 600; letter-spacing: 1px; white-space: nowrap;
    opacity: 0; transform: translateX(16px);
    transition: opacity .3s ease, transform .45s cubic-bezier(.2,.7,.2,1);
  }
  #title.is-en .t-en { opacity: 1; transform: none; }
  /* 手写字：**255×60 完整绘制**（第一版原字比例 854÷201 ≈ 4.249）。
     绝对定位 ⇒ 不参与布局，顶栏仍是 36px；溢出的 12px 落在"上内距"和"面板间距"里，
     所以照片里"字被切了、下面却还有空"的问题不存在了（一个字都不切）。 */
  /* ★★ 2026-11-05（用户："手写标题没有颜色变化"✗）——
     原图是**纯白**字，`sepia/saturate` 对白色不起作用 ⇒ 看着没变色 ✗。
     正确做法：图片当 **mask** ✓，底下铺**金属渐变** ✓ ⇒ 字就是真金属色 ✓；
     书写动画 = 第二层 mask（横向扫描）与图片 mask 用 `mask-composite: intersect` 相乘 ✓，
     所以"金属字 + 书写扫开"能同时存在 ✓。 */
  /* ★★ 2026-11-05（用户："手写标题没有颜色变化"✗）——
     白图用 sepia 不会变色 ✗；正确做法：图片当 **mask** ✓ + 底下铺**金属渐变** ✓。

     **单层 mask + `clip-path` 横向扫描**做"书写"动效 ✓（同样是从左往右扫开 ✓ 且兼容 ✓）。 */

  #title.is-en .t-cn { opacity: 0; }
  /* 每次切回中文时重放一次"书写"（JS 里摘类→强制回流→加回） */
  #title .t-cn.write { animation: qynWrite .95s cubic-bezier(.35,.1,.3,1) 1; }
  @keyframes qynWrite {
    from { clip-path: inset(0 100% 0 0); }
    to   { clip-path: inset(0 0 0 0); }
  }

  /* 齿轮：**右下角**（用户 2026-10-16 提出、2026-10-20 定型）——
     对话区只占左下，右下空出来 ⇒ 齿轮落在**底条那一行的最右端**（body 内距 22px ✓）。
     原来的 `bottom: 84px` 是按**旧的 64px 底条**算的 ✗，底条收到 43px 后就悬在半空。 */
  #gear {
    position: fixed; right: 22px; bottom: 14px; z-index: 30;
    width: 42px; height: 42px; border-radius: 11px; cursor: pointer;
    background: var(--card); color: var(--dim); border: 1px solid var(--line); font-size: 20px;
  }
  #gear:hover { color: var(--fg); border-color: var(--accent); }
  /* ★★ 设置 = **整屏独立界面**（用户 2026-10-16）：点齿轮整屏换过去，参数**分类**展示。
     原来是挂在时钟右边的小浮层（320px），参数一多就挤成一长条，看不清也点不准。 */
  #settings {
    position: fixed; inset: 0; z-index: 100; overflow-y: auto;
    background: var(--bg); padding: 20px 34px 44px;
  }
  #settings[hidden] { display: none; }
  .set-head { display: flex; align-items: baseline; gap: 16px; margin-bottom: 18px; }
  .set-title { font-size: 30px; font-weight: 600; color: var(--accent); letter-spacing: 2px; }
  #set-close {
    margin-left: auto; background: none; border: none; color: var(--dim);
    font-size: 32px; cursor: pointer; line-height: 1;
  }
  #set-close:hover { color: var(--fg); }
  /* 分类：每类一张卡，宽屏自动分列 */
  .set-body {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
    gap: 16px 22px; align-items: start;
  }
  .set-group {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 18px 14px;
  }
  .set-group h3 {
    margin: 0 0 6px; font-size: 18px; font-weight: 600;
    color: var(--accent); letter-spacing: 1px;
  }
  .set-row {
    display: flex; align-items: center; gap: 12px; font-size: 16px; color: var(--dim);
    padding: 5px 0;
  }
  .set-row span { flex: 1; }
  .set-row input {
    width: 104px; padding: 5px 8px; text-align: right; font-size: 18px;
    background: #0b0e12; color: var(--fg); border: 1px solid var(--line); border-radius: 7px;
    font-variant-numeric: tabular-nums;
  }
  .set-row em { font-style: normal; color: var(--faint); width: 34px; font-size: 15px; }
  .set-foot { margin-top: 20px; }
  .set-foot button {
    background: var(--card); color: var(--dim); border: 1px solid var(--line);
    border-radius: 9px; padding: 8px 16px; font-size: 16px; cursor: pointer;
  }
  .set-foot button:hover { color: var(--fg); border-color: var(--accent); }

  /* ★ 标签页式空间管理（用户 2026-10-14）：
     每个面板 = 一个**标签页**。展开时是它本来的尺寸，**收起时宽度收到一半**（省空间，
     腾出来的地方留给以后的面板）；真实使用时标签页**依次展开**（见脚本里的 TAB_ROTATE_MS）。
     TIME 展开时占满剩余宽度（它的课名/作业名是长中文，窄了会折行）。 */
  main { flex: 1; display: flex; gap: 16px; min-height: 0; }
  /* ★★ 宽度**不再写死 px**（用户 2026-10-15 改成按权重分配）：
     实际宽度由 applyTabs 写内联 flex（basis 0 + grow = 权重，展开那块翻倍）——
     整行永远刚好铺满；五块 = 三小（权重 1）+ 两大（权重 2）。
     这里只留 min-width 与过渡（grow 是可过渡的数值）。 */
  .panel { flex: 0 0 auto; min-width: 0; transition: flex-grow .35s ease; }
  .panel.wide { flex: 0 0 auto; }
  .panel.collapsed { flex: 0 0 auto; }
  .panel.wide.collapsed { flex: 0 0 auto; }

  /* SERVICE 面板 · 内容是一张**和监视栏机器卡同款**的 card（用户 2026-10-15：风格要统一）。
     所以这里只放"容器 + 两处必要覆盖"，其余全部复用 .card / .card-head / .mname /
     .state / .row / .k / .v / .extra / .bar —— 不另起一套样式。 */
  /* ★★ 多个 .svc 容器**不许平分整栏高度**（用户 2026-10-16 报的布局问题）：
     原来 `flex: 1` ⇒ 每个容器只拿 1/3 高，而卡片比容器高 ⇒ 内容**溢出并压到下一块上**
     （照片里"余额"跑进 WECHAT 卡、中间一大块空白、AGENT 只剩标题，全是这一个原因）。
     改成按内容定高：容器高度 = 里面卡片高度之和。 */
  .svc { flex: 0 0 auto; display: flex; flex-direction: column; min-height: 0; }
  /* ★ 卡片**不撑满整栏**（用户 2026-10-15："面板太大了"）——
     原来 flex:1 把整栏高度都吃掉，又空又大；现在按内容定高。 */
  .svc .card { flex: 0 0 auto; justify-content: flex-start; padding: 6px 10px; gap: 4px; }
  .svc .card .rows { flex: 0 0 auto; gap: 3px; }
  /* ★ 整体字号调大（用户 2026-10-15）：宁可字大、少留白 */
  .svc .mname { font-size: 22px; flex: 0 0 auto; }   /* 标题一律不压缩（见 svc-node 那段的说明） */
  .svc .row .k { font-size: 15px; }
  .svc .row .v { font-size: 24px; }
  .svc .state { font-size: 14px; }
  .svc .bar { height: 6px; }
  .bar.unknown > i { background: var(--faint); }   /* 没数据 = 灰条，不是 0% */
  /* ★ 监视栏那些条在**收起态是隐藏的**（.panel.collapsed .bar），但 SERVICE 几乎总是
     收起状态 —— 藏了就等于没内容，所以这里显式放行。 */
  .panel.collapsed .svc .bar { display: block; }
  /* 重置时刻：比监视栏的 .mnote（12px）大，收起态也留着（用户 2026-10-15）*/
  .svc .mnote { font-size: 16px; color: var(--dim); min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  /* ★ 刷新倒计时（`3d`）：**面板收起时整列 `.extra` 本来就是隐藏的**
     （见下面 `.panel.collapsed .extra{display:none}`）⇒ 天数**不用自己加规则**，
     展开就自然出现 ✓（用户 2026-10-18："展开后这里显示距离刷新的天数"）。
     ★ 之前我把它挂在 `.svc.focus`（卡片被选中）上 ✗ —— 展开面板但没选中卡时
       天数永远不出现 ⇒ 用户报"根本没有"。教训：**依赖面板级的可见性，不要叠加卡片级焦点**。 */
  /* ★ 刷新倒计时（`(3d)`）：**不是小灰字**（用户 2026-10-18："这个信息是重要的" ✗）——
     正常白字 + 更大字号 ✓（同一轮又调大了一次）；面板收起时整列 `.extra` 本来就不显示 ✓。 */
  .svc .rstd { margin-left: 8px; font-size: 18px; color: var(--fg); font-variant-numeric: tabular-nums; }
  /* ★ 卡头里的**月刷新**倒计时（括号 + 大字白字）：收起不显示 ✓，展开面板才出现 ✓ */
  .svc .rsth {
    display: none; font-size: 26px; font-weight: 600;
    color: var(--fg); font-variant-numeric: tabular-nums;
  }
  .panel:not(.collapsed) .svc .rsth { display: inline; }
  /* ★ SERVICE 卡在**收起态也要留摘要**：那条 `.panel.collapsed .mnote{display:none}` 是给
     机器卡后面的 IP 用的，SERVICE 几乎总是收起状态 —— 藏了摘要，这两块就只剩标题了 ✗ */
  .panel.collapsed .svc .mnote { display: block; }
  /* ★★ 通用 svc-* 卡（探针那类）：**小而密**（用户 2026-10-16："字号和字数都太大了，
     这个模块应该非常小才对"）。探针的 value 是长句子（"12:46 message · 退出码 0 · 63s"），
     所以：字号收小 + **单行省略**；键列改成按内容自适应（固定 50px 会让"最后一轮"折行）。 */
  .svc .card.svc-node { padding: 5px 10px; gap: 2px; }
  .svc .card.svc-node .mname { font-size: 17px; }
  /* ★★ 展开面板时摘要太长会把标题挤成"W…"（用户 2026-10-17 报的问题）：
     收起态靠 `.panel.collapsed .mnote{display:none}` 侥幸没事，一展开就露馅 ✗。
     正确分工：**标题绝不压缩**，被压缩的应该是**摘要**（它自己省略号收尾）。 */
  .svc .card.svc-node .mname { flex: 0 0 auto; }
  .svc .card.svc-node .mnote { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .svc .card.svc-node .state { flex: 0 0 auto; }
  .svc .card.svc-node .rows { gap: 1px; }
  /* ★ 三列：键 / 值 / **右侧空挡**（.extra）。原来是两列 `auto 1fr` ✗ ⇒ 小字被挤到
     第二行再被裁掉 ⇒ "小字没显示"（用户 2026-10-17）。键名已改短，`auto` 就够。 */
  .svc .card.svc-node .row { grid-template-columns: auto 1fr auto; gap: 8px; align-items: baseline; }
  .svc .card.svc-node .row .k { font-size: 13px; white-space: nowrap; }
  .svc .card.svc-node .row .v {
    /* **明细行**的值是长句（"18:03 message · 退出码 0 · 63s"）⇒ 保持小而密 ✓。
       大字只给下面的**核心行**（短值）—— 用户 2026-10-17：
       "打开后改了的就会像现在这样不美观还丢失信息" ✗。 */
    font-size: 15px; min-width: 0; color: var(--fg);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* ★★ 平时**只留卡头一行**（标题 + headline + 等级），明细要鼠标放上去才展开
     （用户 2026-10-16："平时应该只有一行或两行 —— 是否在运行、过不过、有没有错误"）。
     唯一例外：**有问题的行**（warn/bad）常显，这样"有没有错误"不用悬停也看得到。 */
  .svc .card.svc-node .row { display: none; }
  .svc .card.svc-node .row.is-bad { display: grid; }
  .svc .card.svc-node .row.is-core { display: grid; }   /* ★ 核心信息常显（用户 2026-10-17） */
  .svc .card.svc-node:hover .row { display: grid; }
  /* ★★ 键盘/鼠标**选中这张卡**也必须展开（用户 2026-10-17："选择展开时没更多信息" ✗）——
     原来只写了 `:hover`，键盘选中是 `.svc.focus` ⇒ 一行都不会多出来 ✗。 */
  .svc.focus .card.svc-node .row { display: grid; }
  /* ★ 收起态的两行核心信息**单行省略**（它们本来就短；长值会折成 5 行 ✗，所以不铺原始值） */
  .svc .card.svc-node .row.is-core .v {
    font-size: 22px;                                  /* ★ 核心行：值**大字**（墙上惯例） */
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* ★ 右侧空挡里的键值也分大小（用户 2026-10-17："别一行小灰字了" ✗） */
  .svc .card.svc-node .row.is-core .extra .k { font-size: 13px; }
  .svc .card.svc-node .row.is-core .extra .v { font-size: 22px; }
  /* 收起态：留**重置时刻**、砍掉"正常/偏低"那格 —— 等级已经由左侧竖线表达了 */
  .panel.collapsed .svc .state { display: none; }
  /* ★ 出口那块**整块不要了**（用户 2026-10-15："出口通的信息全部不要，只留一个通断性
     放在 OCGO 的第四行"）。这里用 CSS 隐藏而不是删 DOM：数据（svc-egress）照常推，
     以后想恢复只删这一行；也不会破坏对面写的 renderEgress 和它的测试。 */
  #svc-egress { display: none; }

  /* 收起时按各面板的特点砍次要内容 —— **全部用 CSS**，不动渲染逻辑：
     这样展开/收起只是换一个 class，不会因为渲染分支不同而出现两套 bug。 */
  .panel.collapsed .bar { display: none; }        /* 带进度条的：不要条，只留上面那行数字 */
  /* 收起态用**短名**（用户 2026-10-14：WORKSTATION→WS、MAIN WLAN→M WLAN）。
     全名与短名都渲染出来，靠 CSS 切换 —— 收起依然只是换一个 class，不重渲染。*/
  .mabbr { display: none; }
  .panel.collapsed .mfull { display: none; }
  .panel.collapsed .mabbr { display: inline; }
  .panel.collapsed .extra { display: none; }      /* 数字右侧的小字（THREADS / GB 明细） */
  .panel.collapsed .mnote { display: none; }      /* 机器名后的 IP */
  .panel.collapsed .rate-ping { display: none; }  /* 网络：只留速率，藏掉 PING */
  /* 例外：WAN 那块（外网显示屏）收起时**只留 LOSS 一个** ——
     用户 2026-10-14：两个挤在一起显示不下，"还在尝试两个同时显示"。 */
  .panel.collapsed .wan-ping { display: none; }
  .panel.collapsed .body.dual { flex-direction: column; gap: 3px; }
  .panel.collapsed .body.dual .pingbox { display: flex; }
  .panel.collapsed .body.dual .pingbox .v { font-size: 24px; }
  .panel.collapsed .body.dual .wan-ping { display: none; }   /* 放后面，压住上一条的 display:flex */
  /* 时间管理：收起来装不下的，**纵向上滚动**（鼠标移上去滚轮即可） */
  .panel.collapsed .time-cards { overflow-y: auto; }
  /* 收起时的对齐（用户 2026-10-14）：**课程名向左**，其余信息（时间/节次/教室/还剩多久）**靠右** */
  .panel.collapsed .tnext { flex-direction: column; align-items: stretch; gap: 1px; }
  .panel.collapsed .tnext .tcourse { align-self: flex-start; text-align: left; }
  .panel.collapsed .tnext .tmeta { align-self: flex-end; text-align: right; }
  .panel.collapsed .tnext .tright { align-self: flex-end; align-items: flex-end; text-align: right; }
  .panel.collapsed .trow .tname,
  .panel.collapsed .tloc { font-size: 17px; }
  /* ★ 折叠态**只**把课程名放大（用户 2026-10-15 的更正：不是连教室名一起，更不是展开态） */
  .panel.collapsed .tcourse { font-size: 19px; }
  /* 收起时 TIME 的三块分工（用户 2026-10-14）：
     · 课时信息**向右对齐**（上面已改）
     · **DUE 自己滚**（鼠标移上去就能滚），面板本身不滚 —— 这样 NEXT / 异常始终看得见
     · **异常栏只留一行计数**，把高度让给 DUE（原来它在收起态占太高） */
  .panel.collapsed .tcard.due {
    overflow-y: auto; min-height: 0;
    scrollbar-width: thin; scrollbar-color: var(--line) transparent;
  }
  .panel.collapsed .tcard.alert { flex: 0 0 auto; max-height: 64px; overflow: hidden; }
  .panel.collapsed .tcard.alert .tsub { display: none; }

  /* ★ 三个子框的高度：收起态给**显式数值上限**，聚焦时放大 ⇒ 尺寸变化是确定的。
     ★ **纵向尺寸动画已按用户要求去掉**（2026-10-15）：它带来的观感收益不值得那些闪烁风险。
       现在只保留**竖线颜色**过渡 —— 颜色不参与布局，永远不会闪。 */
  .tcard {
    transition: border-color .25s ease;
    scrollbar-gutter: stable;     /* 滚动条出现/消失不再推动布局（那也是一次闪烁） */
  }
  .tcard.grow { flex: 1 1 auto; max-height: 2000px; }        /* 撑满的那块：不设小上限 */
  .tcard.next:not(.grow)  { flex: 0 0 auto; max-height: 152px; }
  /* ★ 缩略（面板收起）时 NEXT 要能放下**两节课** ⇒ 纵向翻倍；展开时保持原样 */
  .panel.collapsed .tcard.next:not(.grow) { max-height: 304px; }
  .tcard.due:not(.grow)   { flex: 0 0 auto; max-height: 360px; }   /* NEXT 省下的纵向空间给 DUE */
  .tcard.alert:not(.grow) { flex: 0 0 auto; max-height: 84px; }

  /* 三个框都能自己滚（条目多了就滚，不截断） */
  .tcard.next, .tcard.due, .tcard.alert {
    overflow-y: auto; min-height: 0;
    scrollbar-width: thin; scrollbar-color: var(--line) transparent;
  }
  /* ★★ 子项**不许被压扁**（用户 2026-10-15 报的"展开 DUE 只有表没有内容"的根因）：
     .tcard 是 flex column，默认 flex-shrink: 1 —— 11 条待办 × 2 行 = 22 个子项挤在
     限高的框里，浏览器会把每项压到 0 高（描述行整行消失 ✗）。装不下应该是**滚动**，
     不是把内容挤没。 */
  .tcard > * { flex: 0 0 auto; }
  /* 选中的那个框：**高亮竖线 + 占满空间**（尺寸过渡由上面的 .grow / 上限负责） */
  /* ★★ 选中的子框要**看得出来**（用户 2026-10-17："TIME / AGENT 蓝框不工作"）：
     原来只改 border-left-color，而各等级的 border-left-color 规则在后面 ⇒ 被盖掉 ✗，
     看上去和"本来就撑满"的块没区别。改成一圈**内描边**（box-shadow 不会被那些规则盖）。 */
  .tcard.focus {
    border-color: var(--accent);
    box-shadow: inset 0 0 0 1px var(--accent);
  }
  /* 按天铺开时的小标题（"10-15 · 今天"）—— 日期字串来自内核，不自己算星期几 */
  .tday { font-size: 13px; color: var(--accent); letter-spacing: 1px; margin: 4px 0 1px; }
  .tday:first-child { margin-top: 0; }
  /* AGENT 面板（规划）—— 主旨、每块的理由、规则来源 */
  .tplan { font-size: 21px; line-height: 1.35; color: var(--fg); }   /* 规划是重点：展开/收起都更大 */
  /* ★ 时段的三行（用户 2026-10-15）：
     · 时间+任务：**紧迫度上色**（正常白 / 紧急橙 / 紧急且 12 小时内红）
     · 详细任务：**白色**（这条信息重要，字号也稍大）
     · 理由：**灰色**，前面一个右箭头（不再写"为什么排这儿"四个字） */
  /* ★ AGENT 的**时段**是信息密度最高的地方，字号要收小（用户 2026-10-15：太大） */
  .tcard.agent-slots .tcourse { font-size: 19px; }
  .agent-gist { font-size: 15px; line-height: 1.35; color: var(--fg); }
  .agent-why  { font-size: 14px; line-height: 1.3; color: var(--dim); }
  .u-normal { color: var(--fg); }
  .u-urgent { color: var(--warn); }
  .u-red    { color: var(--bad); }
/* 用户 2026-10-15：任务 DDL 进红色闪烁区时，规划里那一块要**跟着闪** ——
   复用 DUE 那块的 blinkBad 关键帧，保证"闪"是同一种闪、同一档阈值。 */
.u-red-blink { color: var(--fg); }
body.flash-on .u-red-blink { color: var(--bad); }
  .trule { color: var(--faint); font-size: 12px; }
  /* ★ AGENT 四块的最终空间分配（用户 2026-10-15 第二次修正）：
     **时段是最重要的信息** ⇒ 用**显式 flex** 钉死它永远拿剩下的全部空间；
     规划只够约 3 行；依据/偏好**一直折叠**（只留标题行），被鼠标/键盘选中才展开。
     这里全部写显式 flex，而不是靠"默认 flex: 0 1 auto" —— 上一版正是靠默认值，
     结果在屏幕上完全没生效（时段被挤成 0）。 */
  .tcard.agent-plan  { flex: 0 0 auto; max-height: 140px; }   /* 用户 2026-10-15：规划再给大点 */
  .tcard.agent-slots { flex: 1 1 0; min-height: 0; max-height: 2000px; }
  .tcard.agent-rules { flex: 0 0 auto; max-height: 40px; }
  .tcard.agent-warn  { flex: 0 0 auto; max-height: 40px; }
  /* 被选中（.grow 由 setBox 挂）时由它撑满 —— 必须显式覆盖上面的 flex: 0 0 auto */
  .tcard.agent-plan.grow, .tcard.agent-slots.grow,
  .tcard.agent-rules.grow, .tcard.agent-warn.grow { flex: 1 1 auto; max-height: 2000px; }
  /* 依据 / 偏好平时只留标题行，选中才显示明细（.focus 与 .grow 同时判，双保险） */
  .tcard.agent-rules .tsub,
  .tcard.agent-warn .tsub { display: none; }
  .tcard.agent-rules.grow .tsub, .tcard.agent-rules.focus .tsub,
  .tcard.agent-warn.grow .tsub, .tcard.agent-warn.focus .tsub { display: block; }
  /* ★ 用户 2026-10-16：**事实与理由分开** —— 理由（为什么排这儿）放下一段、左箭头，
     收起时**不显示**，展开才读；事实（时间/任务/具体内容/有什么问题）保持现在的字号，
     收起时也读得到。做法照抄下面依据/偏好块那条（.grow 与 .focus 双判）。 */
  .agent-why { display: none; }
  .tcard.agent-slots.grow .agent-why,
  .tcard.agent-slots.focus .agent-why { display: block; }
  /* 整块面板收起时，哪怕子框带着 .grow 也不显示理由（放在后面，靠顺序压过上面那条） */
  .panel.collapsed .tcard.agent-slots .agent-why { display: none; }
  .tcard.agent-plan, .tcard.agent-slots, .tcard.agent-rules, .tcard.agent-warn {
    overflow-y: auto;
    scrollbar-width: thin; scrollbar-color: var(--line) transparent; scrollbar-gutter: stable;
  }

  .panel {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; min-height: 0;
  }
  .panel-head { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
  .panel-title { font-size: 20px; font-weight: 600; color: var(--accent); letter-spacing: 1px;
                 white-space: nowrap; flex: 0 0 auto; display: inline-block; overflow: hidden; }
  /* 展开切换时，被展开的模块标题做一次**颜色打字机**（用户 2026-10-15）：
     宽度 0 → 12ch 把文字"打"出来，颜色同时从绿扫回主题蓝。类由 applyTabs 挂 1.3 秒。 */
  .panel.typing .panel-title {
    animation: qynTyping .9s steps(14, end) 1, qynTitleColor 1.3s ease 1;
  }
  @keyframes qynTyping { from { width: 0 } to { width: 12ch } }
  @keyframes qynTitleColor {
    0% { color: var(--ok); } 60% { color: var(--accent); } 100% { color: var(--accent); }
  }
  /* ★ 灰色小字**一律不许换行**（用户 2026-10-14："灰色小字影响排版了"）：
     它一折行就会把面板头挤成竖排、压到卡片上。收起（窄面板）时干脆不显示 ——
     它只是注解，不值得占宽度。 */
  .panel-note {
    font-size: 13px; color: var(--faint); margin-left: auto;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .panel.collapsed .panel-note { display: none; }

  /* 四台机器：自上而下，一栏四格。窄栏 ⇒ 字号与间距都要跟着收 */
  .cards { flex: 1; display: flex; flex-direction: column; gap: 9px; min-height: 0; }
  .card {
    flex: 1; background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    /* ★ 微调（用户 2026-10-17："最后一条进度条出框了"）：
       卡片是 `justify-content: center` 且没裁剪 ⇒ 内容一旦比卡片高，就**上下一起溢出**，
       最下面那条 bar 会越过圆角边框。两手一起收：
       ① 内距 8→6px、间距 6→4px，给内容腾出约 8px；
       ② `overflow: hidden` 兜底 —— 再挤也只能裁在框内，绝不跑到卡片外。 */
    padding: 6px 12px; display: flex; flex-direction: column; justify-content: center; gap: 4px;
    border-left: 5px solid var(--lamp, var(--faint)); min-height: 0; overflow: hidden;
  }
  /* ★★★ 灯（lamp）—— 全墙**唯一**的一份"状态 → 灯光颜色"映射（用户 2026-10-18，飞机驾驶舱逻辑）：
       · `ok`   = **绿**：一切正常，不需要注意
       · `warn` = **黄**：需要注意，但不紧急
       · `bad`  = **红**：影响生活 / 让系统无法运行 ⇒ 立刻处理
       · `none` / `off` = **不亮**：没上报 / 离线（= 没电，不是告警）
     任何模块（卡片、子框、网卡…）只要带上这四个类之一，并用 `var(--lamp)` 画它的"灯"，
     就自动接入本系统；**新增模块不需要再写任何颜色** ✗✓。
     汇总由 JS 的 `lightSummary()` 负责 ⇒ 将来两盏主灯（主警告/主错误）直接取它。 */
  .ok   { --lamp: var(--ok); }
  .warn { --lamp: var(--warn); }
  .bad  { --lamp: var(--bad); }
  .none { --lamp: var(--lamp-off); }          /* 没上报：灯不亮 */
  .off  { --lamp: var(--lamp-dark); }         /* 离线：不亮（没电 ≠ 故障） */
  .card.none { opacity: .72; }
  /* ★ 卡片被键盘选中（用户 2026-10-17）：**只高亮，不放大** ——
     原来机器卡带 `flex: 2` 会**撑大**（"选中子界面放大"）✗，用户明确不需要。 */
  .card.focus { border-color: var(--accent); }
  .netcard.focus { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .svc.focus .card { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  /* ★★ 卡的**展开态补充行**（用户 2026-10-17 二次修正）：
     上一版写的是"**面板展开**就露出来" ✗ —— 可切过去的一瞬间面板就展开了 ⇒
     三张卡**全部纵向展开**，按 ↑/↓ 也看不出变化（本来就都开着）✗。
     现在和子框用**同一条规则**：只看**这张卡有没有被选中** ——
     选中哪张，哪张才展开（露出工作区/数据来源/消费/出口明细）；其余保持收起，自动缩小让位。 */
  .svc .more { display: none; }
  /* ★★ 收起态下 SERVICE 的**用量条要留着**（见上面 `.panel.collapsed .svc .bar`），
     但"已用"那三条**不许跟着显示**（用户 2026-10-17 报的 bug："切出去以后三个进度条还在" ✗）。
     根因：`.panel.collapsed .svc .bar{display:block}` 有 **3 个类**，压过了 `.svc .more` 的 2 个 ⇒
     条照样显示。这里用**更高优先级**把它按回去。 */
  .panel.collapsed .svc .bar.more { display: none; }
  .panel .svc.focus .row.more { display: grid; }
  .panel .svc.focus .bar.more { display: block; }
  /* 断联 ≥10s（当关机）：竖线转**灰**，数据区只留 OFFLINE（用户 2026-10-14）
     —— 灰色是"这台不在了"，和红色（"这台有问题"）语义不同，不能混。*/
  /* 离线（.off）的颜色也统一由上面的 `.off { --lamp }` 提供，这里不再单独写 ✗ */
  .offline {
    flex: 1; display: flex; align-items: center; justify-content: center;
    font-size: 22px; letter-spacing: 3px; color: var(--faint);
  }

  .card-head { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
  /* 机器名/状态/IP/右侧小字同样不许换行：窄了宁可截断，也不要把卡片头挤成两行 */
  /* ★★ 名字**永不压缩**（用户 2026-10-23："离线的机器依然要显示名称"）：
     离线时 state 变成 `OFFLINE · 2 小时前`（很长），以前 `.state` 是 `flex:0 0 auto`
     而 `.mname` 可收缩 ⇒ 名字被挤成 0 宽、屏幕上只剩状态 ✗。
     现在反过来：名字固定不缩；该截断的是 note / state ✓ */
  .mname { font-size: 20px; font-weight: 600; white-space: nowrap; overflow: hidden;
           text-overflow: ellipsis; flex: 0 0 auto; max-width: 60%; }
  .mnote { font-size: 12px; color: var(--faint); white-space: nowrap; overflow: hidden;
           text-overflow: ellipsis; min-width: 0; flex: 0 1 auto; }
  .state { margin-left: auto; font-size: 13px; color: var(--dim); font-variant-numeric: tabular-nums;
           white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 0 1 auto; }
  .card.bad .state { color: var(--bad); }

  .rows { display: flex; flex-direction: column; gap: 3px; }
  .row { display: grid; grid-template-columns: 50px 1fr auto; align-items: baseline; gap: 8px; }
  /* 数值前面的名称（CPU / TEMP / RAM / UP / DOWN / PING）：
     原来用 --faint(#5a6673) 太灰，看不清 —— 用户 2026-10-13 要求亮一点 */
  .k { font-size: 13px; color: var(--dim); letter-spacing: .5px; }
  .v { font-size: 22px; font-variant-numeric: tabular-nums; }
  /* ★ 出口行三态（用户 2026-10-19）：正常 OL（白）/ 抖动 OF（**黄**、不闪）/ 真断 OF（红闪 ✓ .blink-bad） */
  .v.warn { color: var(--warn); }
  .v.bad  { color: var(--bad); }
  .v .u { font-size: 12px; color: var(--dim); margin-left: 3px; }
  .extra { font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* 超范围的数字在**白 ↔ 黄/红之间闪烁**（用户 2026-10-13 定的显示逻辑）
     用硬切换（steps）而不是渐变：墙上要的是"一眼看出不对"，不是好看的呼吸灯 */
  /* ★★ 2026-11-06 改：**所有闪烁共用一个时钟**（body.flash-on 由脚本每 450ms 切一次）。
     原来四套 CSS 动画各走各的（1s / 1.1s / 0.9s / 0.9s），而且 CSS 动画从"加上类那一刻"
     才开始跳 ⇒ 多个元素永远对不上相位（用户："闪光效果没有实现同步"）。 */
  @keyframes blinkWarn { 0%, 49% { color: var(--fg); } 50%, 100% { color: var(--warn); } }
  @keyframes blinkBad  { 0%, 49% { color: var(--fg); } 50%, 100% { color: var(--bad); } }
  .blink-warn, .blink-bad { animation: none; }
  body.flash-on .blink-warn { color: var(--warn); }
  body.flash-on .blink-bad  { color: var(--bad); }

  .bar { height: 5px; border-radius: 4px; background: #0b0e12; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent); width: 0; }
  .bar.warn > i { background: var(--warn); }
  .bar.bad  > i { background: var(--bad); }

  .empty { font-size: 15px; color: var(--faint); }

  /* ── NETWORK 面板 ──────────────────────────────────────────────────────
     结构（用户 2026-10-13 定）：**上半 = 内网，下半 = 外网与出口**
     每块只写机器名 + UP / DOWN（+ 内网侧一个 PING）。
     ★ **网卡型号、链路速率一律不显示**，连网卡名也不并进标题 ——
       用户明确说"完全不用显示网卡型号，甚至不用并入标题"；
       位置本身（内网 / 外网）就说明了是哪条链路，省下的高度给字号。
     高度账：卡片区约 715px，内容约 700px，余量由 flex-grow 按比例分。*/
  /* 上半 = 内网，下半 = 外网/出口。
     用户 2026-10-13：**不写"内网/外网"字样**，中间空一段就够（省两行标签的高度）。*/
  .net-group { flex: 0 1 auto; display: flex; flex-direction: column; gap: 5px; min-height: 0; }
  .net-group + .net-group { margin-top: 14px; }
  .net-cards { flex: 1; display: flex; flex-direction: column; gap: 4px; min-height: 0; }
  .netcard {
    flex: 0 1 auto; background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 5px 12px; display: flex; flex-direction: column; gap: 3px;
    border-left: 5px solid var(--lamp, var(--faint)); min-height: 0; overflow: hidden;
  }
  .netcard.none { opacity: .72; }
  .row.net { grid-template-columns: 50px 1fr auto; }
  .row.net .v { font-size: 20px; }
  .row.net .k { font-size: 12px; }

  /* 卡片主体：UP/DOWN 在左，**PING 作为最主要的通断参考放中间**（用户 2026-10-13 看图后要求：
     PING 要更大、置于中心位置）。两者都在"标题下沿 → 卡片底边"之间垂直居中。*/
  .netcard .body {
    flex: 1; display: flex; align-items: center; justify-content: space-between;
    gap: 8px; min-height: 0;
  }
  .netcard .rates { flex: 0 0 auto; min-width: 140px; display: flex; flex-direction: column; gap: 3px; }
  .netcard .pingbox {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 0;
    text-align: center;
  }
  /* 两个对称的大参数（WAN 块的 LOSS 与 公网 PING）：各占一半、各自居中 */
  .netcard .body.dual { justify-content: space-around; }
  /* ★ PING / LOSS 是全墙最大的数字：通断的第一眼判据 */
  .netcard .pingbox .v { font-size: 28px; line-height: 1.1; }

  /* ── TIME 面板（第三栏，占满剩余宽度）──────────────────────────────────
     三块卡：NEXT（下一节课）/ DUE（待办，按内核给的紧迫度排序）/ ALERT（异常）。
     ★ 所有日期、时刻、"还剩多久"都用**内核给的字串**，页面一个日期都不自己算
       （项目铁律：日期由内核算，别处心算必错）。*/
  .time-cards { flex: 1; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  .tcard {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 8px 14px; display: flex; flex-direction: column; gap: 4px;
    border-left: 5px solid var(--lamp, var(--faint)); min-height: 0; overflow: hidden;
    /* ★ 这里**故意不再声明 transition**：尺寸过渡已按用户要求去掉（2026-10-15）。
       原来这条写的是 `transition: flex-grow … , max-height …`，它在级联里**盖掉**了
       上面那条只留颜色过渡的规则 —— 也就是"动画明明删了却还在动"的原因。
       现在过渡只在上面那条 .tcard 规则里声明一次（只过渡颜色）。 */
  }
  .tcard.none { opacity: .75; }   /* 不亮色已由上面统一的 .none { --lamp } 负责 */
  /* ★ 用户 2026-10-16：状态条也要能**闪**（DUE 有"红+闪"的行、或规划完全排不下时）。
     原来只有文字色会闪，边框是死的 —— 这里补一个**只动 border-left-color** 的关键帧，
     节拍和 blinkBad 一致（0.9s、step-end），保证"闪"是同一种闪。 */
  @keyframes blinkBadBar {
    0%, 49%   { border-left-color: var(--fg); }
    50%, 100% { border-left-color: var(--bad); }
  }
  /* ★ 2026-11-06：卡片级闪烁不再使用（它是"整张卡/面板顶端也在闪"的来源）。
     规则留着但只跟全局时钟走，且只在真的需要整卡提示时才加 —— 见 `dueCls`。 */
  .tcard.blink { animation: none; }
  body.flash-on .tcard.blink { border-left-color: var(--bad); }
  .tcard.grow { flex: 1; }
  /* ★ 必须显式写：`.tcard { display: flex }` 会盖掉浏览器对 [hidden] 的 `display:none`
     （UA 样式优先级最低），不写这条 hideBox() 就等于没生效。 */
  .tcard[hidden] { display: none; }

  .tlabel { font-size: 12px; color: var(--dim); letter-spacing: 1px; }
  .tbig { font-size: 26px; font-weight: 600; line-height: 1.15; }
  .twhen { font-size: 22px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .tsub { font-size: 14px; color: var(--dim); }

  /* NEXT：一口气显示接下来两节课。
     用户 2026-10-14：**教室独立成右侧主参数**（照 PING 的摆法）——
     左列 = 上什么课 + 几点（"你上什么"），右侧 = 去哪（"你得去哪"，一眼要看清）。*/
  .tnext { display: flex; align-items: center; gap: 16px; }
  .tnext + .tnext { margin-top: 6px; }
  .tnext .tleft { flex: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .tnext .tright { display: flex; flex-direction: column; align-items: flex-end; gap: 0; }
  /* ★ 教室与课程名**同字号**（用户 2026-10-14：统一成更大的那个）——
     两者是同一层级的信息："上什么课"和"去哪"，不该有主次。 */
  .tcourse { font-size: 22px; font-weight: 600; }
  .tmeta { font-size: 15px; color: var(--dim); }
  .tloc { font-size: 22px; font-weight: 600; color: var(--fg); letter-spacing: .3px; }
  .tnext .twhen { font-size: 14px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .trow { display: flex; align-items: baseline; gap: 12px; }
  .trow .tname { flex: 1; font-size: 18px; }
  .trow .twhy { font-size: 16px; color: var(--dim); font-variant-numeric: tabular-nums; }
  /* DDL 分级（用户 2026-10-14 定）：0–2 小时**红**（闪）、2–24 小时**黄**、其余**绿**。
     越近的行着色越多：红=整行红、黄=整行黄、绿=只给"还剩"那个标记上色（不然一列绿字太吵） */
  /* DUE 分级（用户 2026-10-15 改）：**≤6 小时 = 红 + 闪；6–12 小时 = 红；
     12–24 小时 = 黄；更远 = 绿**。闪烁只留给"最紧急那一档"——全都闪就分不出轻重了。 */
  .trow.red .tname, .trow.red-blink .tname { color: var(--bad); }
  .trow.red .twhy,  .trow.red-blink .twhy  { color: var(--bad); }
  .trow.red-blink .tname, .trow.red-blink .twhy { color: var(--bad); }
  body.flash-on .trow.red-blink .tname, body.flash-on .trow.red-blink .twhy {
    color: var(--fg);
  }
  .trow.yellow .tname { color: var(--warn); }
  .trow.yellow .twhy  { color: var(--warn); }
  .trow.green .twhy   { color: var(--ok); }
  .tgist {
    font-size: 13px; color: var(--faint); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }

  /* 页脚已删（那一行要做对话框与交互区）——规则留着没用，去掉 */
  /* ★ 底部预留条 = **对话入口**（用户 2026-10-15）：点它 → 对话层从下面弹起覆盖全屏 */
  #dock {
    /* ★ 高度收到原来的**三分之二**（用户 2026-10-17：64 → 43px）。
       它是 flex 布局里的固定高度项 ⇒ 省下的 ~21px **自动**归给上面的面板区
       （main 是 flex:1），不需要别处再调。 */
    /* ★ 2026-11-09（用户）：50% → **40%** —— 右边的空档留给「⟳ 重排」按钮 ✓
       否则按钮会和 MASTER WARNING 撞在一起 ✗（实测 50% 时两者间距只有 ~10px ✗）*/
    flex: 0 0 43px; width: 40%; align-self: flex-start; border-radius: 12px;
    border: 1px dashed #1d242c;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  #dock:hover { border-color: var(--accent); }
  .dock-hint { font-size: 12px; color: var(--faint); letter-spacing: 1px; }
  /* 「一键重排」按钮（用户 2026-11-08）—— **常驻**在底条上，点一下就让 Agent 重排一轮。
     原来是"只在计划表最上面那条已完成时才出现"（用户 2026-10-15 的触发策略）；
     现在改成常驻，那个条件仍然用样式强调（.topdone）—— 那种时候最该重排。 */
  /* ★ 2026-11-09（用户）：重排按钮**移到对话条右边的空档** ✓
     对话条占左半边（width:50%），右边到 MASTER 灯之间是空的 ⇒ 按钮固定在那儿 ✓
     fixed 定位 ⇒ 不受 body 的 column flex 影响 ✓，与 dock 同高（43px）同底（14px）✓ */
  #dock-replan {
    position: fixed; left: calc(40% + 10px); bottom: 14px; z-index: 31;
    height: 43px; padding: 0 18px; font-size: 14px; cursor: pointer;
    background: #1b2530; color: var(--accent); border: 1px solid var(--accent);
    border-radius: 12px; white-space: nowrap; font-family: inherit;
    display: inline-flex; align-items: center; gap: 6px;
  }
  #dock-replan:hover { background: #22303d; }
  #dock-replan.topdone { background: #2a2113; color: var(--warn); border-color: var(--warn); }
  #dock-replan.topdone:hover { background: #3a2c17; }
  #dock-replan.busy { color: var(--dim); border-color: var(--line); cursor: progress; }
  #dock-replan.done { color: var(--ok); border-color: var(--ok); }
  #dock-replan[hidden] { display: none; }

  /* 对话区（纯文字版）：★ 用户 2026-10-20 —— **不再覆盖全屏** ✗，
     改成"从底条那**左半边**向上拉起"：左半宽 + 贴在底条上方 + 最高 62vh。
     底条本身缩到左半（#dock width:50%），右半留空。 */
  #chat {
    position: fixed; left: 0; bottom: 57px; width: 50%; max-height: 62vh; z-index: 50;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px 12px 0 0;
    display: flex; flex-direction: column;
    padding: 12px 16px 14px;
    transform: translateY(100%); opacity: 0; pointer-events: none;
    transition: transform .3s ease, opacity .3s ease;
    box-shadow: 0 -10px 30px #0007;
  }
  #chat.chat-open { transform: translateY(0); opacity: 1; pointer-events: auto; }
  .chat-head { display: flex; align-items: baseline; gap: 12px; padding-bottom: 8px;
               border-bottom: 1px solid var(--line); }
  .chat-title { font-size: 20px; font-weight: 600; color: var(--accent); letter-spacing: 1px; }
  .chat-state { font-size: 13px; color: var(--faint); }
  #chat-close { margin-left: auto; background: none; border: none; color: var(--dim);
                font-size: 26px; line-height: 1; cursor: pointer; }
  #chat-close:hover { color: var(--fg); }
  .chat-log { flex: 1; overflow-y: auto; padding: 12px 2px; display: flex;
              flex-direction: column; gap: 10px; }
  .msg { max-width: 78%; padding: 9px 13px; border-radius: 12px; font-size: 16px;
         line-height: 1.45; white-space: pre-wrap; word-break: break-word; }
  .msg.user { align-self: flex-end; background: #16324a; }
  .msg.agent { align-self: flex-start; background: var(--card); border: 1px solid var(--line); }
  .msg.sys { align-self: center; color: var(--faint); font-size: 14px; }
  .chat-input { display: flex; gap: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
  #chat-text { flex: 1; padding: 10px 12px; font-size: 16px; border-radius: 10px;
               background: #0b0e12; color: var(--fg); border: 1px solid var(--line); }
  #chat-send { padding: 0 18px; font-size: 16px; border-radius: 10px; cursor: pointer;
               background: var(--card); color: var(--fg); border: 1px solid var(--line); }
  #chat-send:hover { border-color: var(--accent); }
  /* ★ 带图（用户 2026-10-20）：待发图片的小片 + 选图按钮 */
  .chat-chips { display: flex; flex-wrap: wrap; gap: 6px; padding-top: 8px; }
  .chat-chip {
    display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dim);
    background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 3px 8px;
  }
  .chat-chip button { background: none; border: none; color: var(--faint);
                      cursor: pointer; font-size: 14px; line-height: 1; }
  .chat-chip button:hover { color: var(--bad); }
  #chat-pick {
    padding: 0 12px; font-size: 18px; border-radius: 10px; cursor: pointer;
    background: var(--card); color: var(--dim); border: 1px solid var(--line);
  }
  #chat-pick:hover { color: var(--fg); border-color: var(--accent); }
  /* ★★ 主警告 / 主错误（波音 MASTER WARNING / MASTER CAUTION 样式）
     真实件观感：**黑底透镜 + 刻字**，点亮时**字样发光**（红 / 琥珀），未点亮时透镜是暗的 ✓
     （正好符合"全正常时除了绿色没有颜色"——这两盏平时是暗的）。
     位置：右下角空挡 —— 齿轮在 right:22 / 宽 42 ⇒ 这里 right:76 正好夹在中间。 */
  #masters {
    position: fixed; right: 76px; bottom: 14px; z-index: 30;
    display: flex; gap: 8px; align-items: center; height: 42px;
  }
  .master {
    height: 42px; padding: 0 17px; border-radius: 8px; cursor: pointer;
    background: #080a0d; border: 1px solid #232a33;
    font: 600 14px/1 "Noto Sans CJK SC", "Microsoft YaHei", system-ui, sans-serif;
    letter-spacing: .16em; text-transform: uppercase;
    color: #39424d;                          /* 未点亮：刻字几乎看不见（黑透镜） */
    transition: color .18s ease, border-color .18s ease, box-shadow .18s ease, background .18s ease;
  }
  .master:hover { color: #cfd8e3; border-color: #3a444f; }
  .master.warning.lit {                      /* 红：MASTER WARNING */
    color: #ff6b5e; background: #2a0f0d; border-color: #8d2a22;
    box-shadow: inset 0 0 0 1px #8d2a22, 0 0 18px #f8514966;
  }
  .master.caution.lit {                      /* 琥珀：MASTER CAUTION */
    color: #ffc447; background: #2a2109; border-color: #8a6415;
    box-shadow: inset 0 0 0 1px #8a6415, 0 0 18px #d2992266;
  }
  /* ★ 角标：还"压着"几项被按掉的致因 —— 墙上**直接看得见**（不靠悬停 ✗） */
  .master .mk {
    display: inline-block; margin-left: 9px; padding: 0 6px; border-radius: 4px;
    font-size: 12px; letter-spacing: 0; vertical-align: 1px;
  }
  .master .mk:empty { display: none; }
  .master.warning .mk { color: #ff8f85; background: #3a1512; }
  .master.caution .mk { color: #ffcf6b; background: #3a2c0c; }
  /* ★ "按掉了但原因还在" —— 灯暗下来，但**不是"没问题"**：降亮度 + 保留彩色细边 + 角标 ✓ */
  .master.muted { opacity: .55; }
  .master.warning.muted { border-color: #5a2019; color: #b1554c; }
  .master.caution.muted { border-color: #5a4214; color: #b08b3a; }

  /* KPL 2026 · 深场白金。仅视觉覆盖；布局、数据与交互沿用原页面。 */
  :root {
    color-scheme: dark;
    /* ★ 2026-11-05：主色改取参考包的**明场光舞台**色板（香槟金 / 象牙雾 / 翡翠冷光）✓
       底仍是暗色（用户屏幕漏光 ⇒ 背景压暗 ✓），只把"金/象牙/翡翠"这三族搬过来 ✓ */
    --bg: #100d0b; --panel: #241e19; --card: #2b241e;
    --line: #4e3d2a; --fg: #fdf9f2; --dim: #e6d8bd; --faint: #a2907a;
    --ok: #a8813f; --warn: #e8cf9f; --bad: #c9614e; --accent: #e4c591;
    --lamp-off: #4e3d2a; --lamp-dark: #675138;
    --gold-700: #8f6531; --gold-500: #c39667; --gold-300: #e4c591; --gold-100: #fff6e4;
    --ls-ivory: #f7f1e5; --ls-paper: #efe6d6; --ls-sand: #d9c7a6;
    --ls-teal: #4fd2a8; --ls-emerald-dim: rgba(79, 210, 168, .35);
    --paper: #f4f1ec; --ink: #28221b;
    --hairline: rgba(224,190,143,.62); --hairline-soft: rgba(201,162,107,.29);
    --metal: linear-gradient(174deg, #fbf0d2 0%, #ecd3a0 16%, #d3ac72 34%, #b1834c 50%, #dcb87e 66%, #f6e5bb 82%, #ba9058 100%);
    --paper-sheen: linear-gradient(126deg, transparent 60%, rgba(255,255,255,.72) 61%, transparent 64%, transparent 74%, rgba(255,255,255,.64) 75%, transparent 78%);
    --radius: 5px;
    --font-cn: "Noto Sans SC", "Noto Sans CJK SC", "Microsoft YaHei", system-ui, sans-serif;
    --font-latin: "Bahnschrift", "Liberation Sans", "DejaVu Sans", "Microsoft YaHei", sans-serif;
  }
  body {
    background-color: var(--bg);
    background-image:
      radial-gradient(ellipse at 82% 5%, rgba(224,190,143,.09), transparent 60%),
      linear-gradient(180deg, rgba(12,10,8,.46), rgba(11,9,7,.60) 58%, rgba(8,7,6,.72)),
      var(--bg-img);
    background-size: auto, auto, cover;
    background-position: center;
    background-repeat: no-repeat;
    font-family: var(--font-cn);
    -webkit-font-smoothing: antialiased;
  }
  /* 标题沿用手写字和双语切换，金属色仅用于英文与时钟。 */
  #title .t-en {
    font-family: var(--font-latin); font-weight: 700; letter-spacing: .14em;
    background: var(--metal); background-clip: text; -webkit-background-clip: text;
    color: transparent;
  }
  /* （手写标题的滤镜方案已废弃：白图不变色 ✗ ⇒ 改用 mask + 金属渐变 ✓）*/
  #clock { font-family: var(--font-latin); letter-spacing: .015em; }
  #clock .clk-d { color: var(--paper); }
  #clock .clk-t { color: var(--gold-300); }
  #conn { font-family: var(--font-latin); letter-spacing: .08em; }

  /* 玄石底与象牙白标题带：装饰绝对定位，不占用原布局空间。 */
  .panel {
    border-radius: var(--radius);
    border-color: var(--hairline-soft);
    /* ★ 2026-11-05：改**半透明** + 轻模糊 ⇒ 背景图透出来，但文字对比度不降 ✓ */
    background: linear-gradient(160deg, rgba(40,34,28,.58), rgba(26,22,18,.68));
    backdrop-filter: blur(3px) saturate(1.04);
    box-shadow: inset 0 1px rgba(244,241,236,.05);
  }
  .panel:not(.collapsed) {
    border-color: rgba(224,190,143,.65);
    box-shadow: inset 0 1px rgba(243,227,187,.12);
  }
  .panel-head { position: relative; isolation: isolate; }
  /* ★★ 2026-11-05 用户："白框不美观 改掉" —— 原来是象牙白标题带（#fbfaf7→#e8e3db）✗，
     现在改成**半透明暖墨带 + 右侧金发丝**：和深场同色系 ✓，背景仍能透出来 ✓，
     标题字改金（深底上金字 ✓），不再有白色块 ✗ */
  .panel-head::before {
    content: ""; position: absolute; inset: -5px -8px; z-index: -1;
    border-radius: 2px; border-right: 2px solid var(--hairline);
    background: linear-gradient(180deg, rgba(58,49,40,.52), rgba(38,32,26,.34));
    backdrop-filter: blur(2px);
  }
  .panel:not(.collapsed) .panel-head::before {
    border-right-color: var(--gold-300);
    background: linear-gradient(180deg, rgba(74,61,46,.58), rgba(46,38,30,.40));
  }
  /* ★ 2026-11-05（用户）：列标题（DATACENTER…）比**子标题淡一点** ✓
     标题 = 暗金 + 600 + 大字距（退后 ✓）；子标题 = 亮香槟（信息更近 ✓）*/
  .panel-title {
    font-family: var(--font-latin); font-weight: 600;
    letter-spacing: .06em;          /* ★ 2026-11-05 用户："DATACENTER 稍微越界" ⇒ .18em → .06em ✓ */
    text-transform: uppercase;
    color: #9d7f52;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
  }
  .panel-note {
    font-family: var(--font-latin); font-weight: 500;
    letter-spacing: .03em;          /* 子标题同步收窄 ✓ */
    text-transform: uppercase;
    color: #e4c591;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
  }
  @keyframes qynTitleColor {
    0% { color: var(--gold-300); } 100% { color: var(--gold-100); }
  }

  /* 深色数据面留出远距离阅读对比，灯光颜色仍来自原来的 --lamp。 */
  .card, .netcard, .tcard {
    border-radius: var(--radius);
    border-color: var(--hairline-soft);
    border-left-color: var(--lamp, var(--lamp-off));
    /* ★ 半透明卡面（用户 2026-11-05："为了显示出背景把框框改成半透明的"）✓
       左上角一层金色斜光 + 深墨底 ~55-65% 透明，背景纹理透得出来 ✓ */
    background: linear-gradient(135deg, rgba(74,63,50,.30), transparent 58%),
                linear-gradient(180deg, rgba(46,39,32,.52), rgba(36,30,25,.62));
    backdrop-filter: blur(4px) saturate(1.05);
  }
  .card.focus, .netcard.focus, .tcard.focus {
    border-color: var(--hairline);
    border-left-color: var(--lamp, var(--lamp-off));
    box-shadow: inset 0 0 0 1px rgba(224,190,143,.28);
  }
  .k, .tlabel {
    font-family: var(--font-latin); color: #debf91;
    letter-spacing: .035em;
  }
  .v, .state, .extra { font-family: var(--font-latin); font-variant-numeric: tabular-nums; }
  .v { letter-spacing: 0; }
  .mname { letter-spacing: .015em; }
  .state { letter-spacing: .025em; }
  .card-head .state { color: var(--dim); }
  .card.ok .state, .netcard.ok .state { color: var(--ok); }
  .card.warn .state, .netcard.warn .state { color: var(--warn); }
  .card.bad .state, .netcard.bad .state { color: var(--bad); }
  .offline { color: var(--faint); white-space: nowrap; letter-spacing: .12em; }
  .netcard .offline { font-size: 13px; letter-spacing: .025em; }
  .bar { border-radius: 2px; background: #1d1915; }
  .bar > i { border-radius: 2px; background: linear-gradient(90deg, #8f6531, #e4c591); }
  .bar.ok > i { background: linear-gradient(90deg, #2f7f68, #4fd2a8); }
  .bar.warn > i { background: var(--warn); }
  .bar.bad > i { background: var(--bad); }
  .bar.unknown > i { background: var(--faint); }
  .tday { color: var(--gold-300); }

  /* 底条、对话和设置统一为暖色；保留原来的位置与尺寸。 */
  #dock { border-radius: var(--radius); border: 1px solid var(--hairline-soft); background: rgba(36,30,25,.68); }
  #dock:hover { border-color: var(--gold-300); background: rgba(59,48,36,.8); }
  .dock-hint { color: var(--dim); }
  #gear { border-radius: var(--radius); border-color: var(--hairline-soft); background: #302820; }
  #gear:hover { color: var(--gold-100); border-color: var(--hairline); }
  /* 重排按钮（黑金主题）：和 dock/gear 同一套金发丝线 ✓ 2026-11-09 */
  #dock-replan {
    border-radius: var(--radius); border: 1px solid var(--hairline-soft);
    background: #302820; color: var(--gold-300);
  }
  #dock-replan:hover { border-color: var(--hairline); color: var(--gold-100); background: rgba(59,48,36,.85); }
  #dock-replan.topdone { border-color: var(--warn); color: var(--warn); background: #2a2113; }
  #dock-replan.busy { color: var(--dim); border-color: var(--line); }
  #dock-replan.done { border-color: var(--ok); color: var(--ok); }
  #settings { background: linear-gradient(135deg, #30281f, #201b17 68%); }
  .set-title { color: var(--gold-100); }
  .set-group { border-radius: var(--radius); border-color: var(--hairline-soft); background: #302820; }
  .set-group h3 { color: var(--gold-300); }
  .set-row input, #chat-text { background: #211c17; border-color: #6b5841; border-radius: var(--radius); }
  .set-foot button, #set-close, #chat-send, #chat-pick, .chat-chip { border-radius: var(--radius); }
  #chat { border-color: var(--hairline); background: #27211b; border-radius: 5px 5px 0 0; box-shadow: 0 -8px 24px #160f0a55; }
  .chat-title { color: var(--gold-300); }
  .msg { border-radius: var(--radius); }
  .msg.user { background: #4c3c29; border: 1px solid var(--hairline-soft); }
  .msg.agent { background: #332b23; }
  .master { border-radius: var(--radius); background: #211c17; border-color: #4a4034; color: #8d8070; }
  .master:hover { color: var(--paper); border-color: var(--hairline); }
  .master.warning.lit { color: #ff9d8d; background: #3b211b; border-color: #c56b58; box-shadow: inset 0 0 0 1px #9b5143; }
  .master.caution.lit { color: #f6cc82; background: #392c18; border-color: #bd934b; box-shadow: inset 0 0 0 1px #96723c; }
  :is(button, input):focus-visible { outline: 2px solid var(--gold-100); outline-offset: 3px; }

  /* 继承现有窄栏的字号修正；不改变宽度、顺序或折叠规则。 */
  .panel.collapsed .svc .mname { font-size: 16px; }
  .panel.collapsed .svc .row { grid-template-columns: 42px 1fr auto; gap: 6px; }
  .panel.collapsed .svc .row .k { font-size: 12px; letter-spacing: 0; }
  .panel.collapsed .svc .row .v { font-size: 19px; }
  .panel.collapsed .svc .state { font-size: 12px; }
  .panel.collapsed .svc .card { padding: 5px 8px; }
  @media (max-width: 1240px) {
    .card .mnote { display: none; }
    .card .state { font-size: 12px; letter-spacing: .025em; }
  }
  /* 800×600 横屏的视觉密度：五栏顺序和 flex 权重原样保留。 */
  @media (max-width: 900px) {
    main { gap: 8px; }
    .panel { padding: 10px 6px; gap: 10px; }
    .panel-head { gap: 4px; }
    .panel-head::before { inset: -4px -2px; }
    .panel-title { font-size: 12px; letter-spacing: 0; }
    .panel.collapsed .panel-title { font-size: 10px; }
    .panel-note { font-size: 10px; }
    .card, .netcard { padding: 5px 6px; gap: 2px; }
    .card-head { gap: 4px; }
    .mname, .svc .mname, .panel.collapsed .svc .mname { font-size: 13px; max-width: 100%; letter-spacing: 0; }
    .state, .card .state, .panel.collapsed .svc .state { font-size: 10px; letter-spacing: 0; }
    .rows { gap: 1px; }
    .row, .row.net, .panel.collapsed .svc .row { grid-template-columns: 28px minmax(0, 1fr) auto; gap: 4px; }
    .row .k, .row.net .k, .svc .row .k, .panel.collapsed .svc .row .k { font-size: 10px; letter-spacing: 0; }
    .row .v, .row.net .v, .svc .row .v, .panel.collapsed .svc .row .v { font-size: 16px; }
    .extra, .mnote { font-size: 10px; }
    .netcard .rates { min-width: 0; flex: 1; }
    .netcard .body { gap: 4px; }
    .netcard .pingbox .v { font-size: 18px; }
    .panel.collapsed .netcard .body .rates { width: 100%; }
    .offline { font-size: 12px; letter-spacing: .025em; }
    .netcard .offline { font-size: 10px; letter-spacing: 0; }
    .empty { font-size: 11px; }
    .svc .card.svc-node { padding: 5px 6px; }
    .svc .card.svc-node .mname { font-size: 12px; }
    .svc .card.svc-node .row.is-core .v, .svc .card.svc-node .row.is-core .extra .v { font-size: 15px; }
    .svc .mnote { font-size: 11px; }
    .panel.collapsed .svc .card { padding: 5px 6px; }
    .tcard { padding: 7px 6px; }
    .tlabel { font-size: 10px; letter-spacing: 0; }
    .tcourse, .panel.collapsed .tcourse, .tloc, .panel.collapsed .tloc { font-size: 14px; }
    .tmeta, .tnext .twhen, .tgist, .tsub { font-size: 11px; }
    .trow { gap: 5px; }
    .trow .tname, .panel.collapsed .trow .tname { font-size: 13px; }
    .trow .twhy { font-size: 11px; }
    .tplan { font-size: 16px; }
    .tcard.agent-slots .tcourse { font-size: 14px; }
    .agent-gist, .agent-why { font-size: 12px; }
    .dock-hint { font-size: 10px; letter-spacing: 0; }
    .master { padding: 0 10px; font-size: 10px; letter-spacing: .08em; }
  }
  @media (prefers-reduced-motion: reduce) {
    #title .t-en { transition: none; }
    .panel.typing .panel-title { animation: none; }
  }

  /* ══ 金属质感（用户 2026-11-05："多使用金属质感和元素"）════════════════ */
  /* ① 卡片顶边一条**金属发丝**（line-diamond-line 的简化版 ✓ 只给 1px）*/
  .card, .netcard, .tcard { position: relative; }
  .card::before, .netcard::before, .tcard::before {
    content: ""; position: absolute; left: 8px; right: 8px; top: 0; height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold-500) 18%, var(--gold-100) 50%,
                var(--gold-500) 82%, transparent);
    opacity: .55; pointer-events: none;
  }
  /* ② 进度条：金属渐变（深金→香槟→反光→金）*/
  .bar > i {
    background: linear-gradient(90deg, #675138 0%, #8f6531 18%, #c39667 42%,
                #fff6e4 52%, #e4c591 64%, #8f6531 84%, #675138 100%);
  }
  .bar.ok > i { background: linear-gradient(90deg, #4e3d2a, #8f6531 30%, #c39667 55%, #e4c591 75%, #8f6531 100%); }
  /* ③ 设置标题 / 对话标题：金属字 */
  .set-title, .chat-title {
    background: var(--metal); background-clip: text; -webkit-background-clip: text;
    color: transparent; filter: drop-shadow(0 1px 1px rgba(0,0,0,.5));
  }
  /* ④ 主灯：金属描边 + 内发光 */
  .master { border-width: 1px; }
  .master.warning.lit {
    border-color: var(--gold-500);
    box-shadow: inset 0 0 0 1px rgba(255,246,228,.22), 0 0 16px rgba(201,97,78,.30);
  }
  .master.caution.lit {
    border-color: var(--gold-300);
    box-shadow: inset 0 0 0 1px rgba(255,246,228,.28), 0 0 16px rgba(228,197,145,.26);
  }
  /* ⑤ 底条：金属细边 */
  #dock { box-shadow: inset 0 1px rgba(255,246,228,.10); }
  /* ⑥ 时钟日期：金属字（比纯白更"贵" ✓）*/
  /* ★ 2026-11-05（用户）：**日期小、时间大** —— 日期 21px 暗金，时间 42px 金属字 */
  #clock { display: inline-flex; align-items: baseline; gap: 10px; }
  #clock .clk-d { font-size: 21px; font-weight: 600; letter-spacing: .05em; color: var(--gold-500); }
  #clock .clk-t { font-size: 42px; font-weight: 700; letter-spacing: .01em;
                  background: var(--metal); background-clip: text; -webkit-background-clip: text;
                  color: transparent; filter: drop-shadow(0 1px 1px rgba(0,0,0,.55)); }

  /* ① 白标题 → 金属字（CENTER / SERVER / MAIN / WORKSTATION…）*/
  .card-head .mname {
    background: var(--metal); background-clip: text; -webkit-background-clip: text;
    color: transparent; filter: drop-shadow(0 1px 1px rgba(0,0,0,.6));
  }
  #title .t-en { filter: drop-shadow(0 1px 2px rgba(0,0,0,.65)) brightness(.94) saturate(1.2); }
  /* ② 主警告 / 主错误：金属浮雕镜片 + 对应色 + 内发光 */
  .master {
    border-radius: 6px; letter-spacing: .16em;
    background: linear-gradient(180deg, rgba(255,246,228,.10), transparent 42%),
                linear-gradient(180deg, #2a221b, #1b1611);
    box-shadow: inset 0 1px rgba(255,246,228,.16), inset 0 -1px rgba(0,0,0,.55), 0 1px 0 rgba(0,0,0,.5);
  }
  .master.warning.lit {
    color: #ffb3a6; border: 1px solid #c9614e;
    background: linear-gradient(180deg, rgba(255,246,228,.14), transparent 40%),
                radial-gradient(120% 140% at 50% 0%, #7e2419 0%, #3a110c 62%, #240b08 100%);
    box-shadow: inset 0 1px rgba(255,214,205,.30), inset 0 -1px rgba(0,0,0,.6), 0 0 18px rgba(201,97,78,.34);
  }
  .master.caution.lit {
    color: #ffe2a8; border: 1px solid #e4c591;
    background: linear-gradient(180deg, rgba(255,246,228,.16), transparent 40%),
                radial-gradient(120% 140% at 50% 0%, #8a5c14 0%, #3d2a0b 62%, #241907 100%);
    box-shadow: inset 0 1px rgba(255,240,214,.34), inset 0 -1px rgba(0,0,0,.6), 0 0 18px rgba(228,197,145,.30);
  }
  /* ③ 背景装饰：翡翠冷光（左下 + 右上，镜像 ✓）+ 面板顶部金属浮雕双线 */
  body::before, body::after {
    content: ""; position: fixed; z-index: 0; pointer-events: none;
    background: var(--glow-emerald) center/contain no-repeat; mix-blend-mode: screen;
  }
  body::before { right: -170px; bottom: -210px; width: 620px; height: 620px; opacity: .19; }
  /* ★ 2026-11-05（用户）：**左下角翡翠绿光点**点缀 ✓
     两层：① 22px 网格的翡翠小点（1.3px 实心 ✓ 参考"星尘"但用翡翠色 ✓）
           ② 底下垫一张 glow_emerald（光晕 ✓ 让点阵"亮起来" ✓）
     用 radial-gradient 遮罩让它**只亮在左下角** ✓、往中间渐隐 ✓ 不干扰读数 ✓ */
  body::after {
    content: ""; position: fixed; z-index: 0; pointer-events: none;
    left: -40px; bottom: -60px; right: auto; top: auto;
    width: 460px; height: 400px;
    background-image:
      radial-gradient(circle, rgba(150, 245, 205, 1) 1.7px, transparent 2.4px),
      radial-gradient(circle, rgba(79, 210, 168, .55) 3.2px, transparent 4.2px),
      var(--glow-emerald);
    background-size: 22px 22px, 88px 88px, contain;
    background-repeat: repeat, repeat, no-repeat;
    background-position: 0 0, 44px 44px, center;
    mix-blend-mode: screen;
    opacity: .85;
    -webkit-mask-image: radial-gradient(115% 115% at 0% 100%, #000 0%, rgba(0,0,0,.55) 40%, transparent 70%);
    mask-image: radial-gradient(115% 115% at 0% 100%, #000 0%, rgba(0,0,0,.55) 40%, transparent 70%);
  }
  .panel { position: relative; }
  .panel::after {
    content: ""; position: absolute; left: 10px; right: 10px; top: 0; height: 2px; pointer-events: none;
    background: linear-gradient(90deg, transparent, rgba(255,246,228,.42) 22%,
                rgba(255,246,228,.18) 50%, rgba(255,246,228,.42) 78%, transparent);
    box-shadow: 0 1px 0 rgba(0,0,0,.45);
  }

  }

  /* ════════════════════════════════════════════════════════════════════
     金属扫光（用户 2026-11-05）：**斜向同步、一次闪烁、不要一起闪** ✓
     做法：
       ① 所有金属面共用**同一条 105° 渐变** ✓（同一块"金属板"✓）
       ② 同一个 14s 周期 ✓，前 64% 静止、后 24% 快速扫过 ⇒ **一次闪** ✓
       ③ 五栏用 `--sweep-delay` **错开** ✓（CSS 变量可继承 ✓）⇒ 光带**从左往右斜着
          扫过整面墙一次** ✓，而不是所有字同时亮 ✗
     ════════════════════════════════════════════════════════════════════ */
  @keyframes qynMetalSweep {
    0%, 64%   { background-position: 0% 0%; }
    88%, 100% { background-position: 100% 100%; }
  }
  /* 五栏错开：光带横穿整墙 ✓（--sweep-delay 会被子元素继承 ✓）*/
  .panel:nth-of-type(1) { --sweep-delay: 0s; }
  .panel:nth-of-type(2) { --sweep-delay: .26s; }
  .panel:nth-of-type(3) { --sweep-delay: .52s; }
  .panel:nth-of-type(4) { --sweep-delay: .78s; }
  .panel:nth-of-type(5) { --sweep-delay: 1.04s; }

  /* ★★ 修正（2026-11-05 用户报"有些文字消失 / 展开时还是白色"）：
     ① 手写标题 `.t-cn` **不能**套 `background-clip: text` ✗ —— 它靠 **mask** 出字，
        渐变必须铺满整块再被遮罩裁出来 ✓ ⇒ 单独一条规则（只给渐变 + 动画）。
     ② 静止位置原来停在渐变最暗端 ✗ ⇒ 现在渐变两端都是**中金**（可读 ✓），

        —— 万一 `background-clip:text` 没生效（或别的动画改了 color ✓），

    background-image: linear-gradient(100deg,

  .card-head .mname, .panel-title, .panel-note, .k, .tday, .tlabel {
    /* 窄高光条带 ✓：暗金占大部分、中间一道近白反光 ⇒ 移动时是"光扫过金属" ✓ */
    /* ★ 静止态 = **均匀中金**（无高光停留 ✓）；近白高光只占中间 10% ✓

       · 主标题：在中英**切换**时扫一次 ✓（同样 5s ✓ 一次 ✓）
     ════════════════════════════════════════════════════════════════════ */
  @keyframes qynSheenSlow {
    /* ★★ 2026-11-06 六帧实测（p=0/20/40/60/80/100）结论：
         p 增大 ⇒ 高光从**右往左**走 ✗

// ★ 设置浮层的开关闭包（bindSettings 里赋值）—— 供唯一的键盘监听器 bindKeys() 调 ✓

  if (!gear || !panel) return;
  const toggle = (on) => { panel.hidden = !on; if (on) renderSettings(); };
  // ★ 主题按钮：事件委托（设置面板每次重画，不能逐个绑 ✓）
